<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>betwinner — Search Console</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --page: #f2f4f8;
    --text-primary: #0b1220;
    --text-secondary: #52596b;
    --text-muted: #8a90a3;
    --grid: #e6e9f0;
    --border: rgba(11,18,32,0.08);
    --card-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 6px 20px rgba(15,23,42,0.06);
    --series-1: #2a78d6;
    --series-3: #1baf7a;
    --good: #0ca30c;
    --warning: #fab219;
    --critical: #d03b3b;
    --brand-a: #2a78d6;
    --brand-b: #6d4ae0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--page); color: var(--text-primary); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
  h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--text-muted); font-size: 13px; margin-top: 4px; }
  a.back { color: var(--brand-a); text-decoration: none; font-size: 13px; font-weight: 600; }
  a.back:hover { text-decoration: underline; }
  select#domain-select {
    padding: 9px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-1); font-size: 14px; font-weight: 600; color: var(--text-primary);
    box-shadow: var(--card-shadow); min-width: 260px; cursor: pointer;
  }
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi-card { background: var(--surface-1); border-radius: 14px; padding: 16px 18px; box-shadow: var(--card-shadow); }
  .kpi-label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi-value { font-size: 26px; font-weight: 800; margin-top: 6px; letter-spacing: -.01em; }
  .card { background: var(--surface-1); border-radius: 16px; padding: 20px; box-shadow: var(--card-shadow); margin-bottom: 18px; }
  .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 14px; }
  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .charts-row { grid-template-columns: 1fr; } }
  .chart-title { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  svg.trend { width: 100%; height: 160px; overflow: visible; }
  .trend-line { fill: none; stroke-width: 2; }
  .trend-area { opacity: .08; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 10px; color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--grid); cursor: pointer; user-select: none; }
  th:hover { color: var(--text-primary); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--grid); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tables-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 900px) { .tables-row { grid-template-columns: 1fr; } }
  .status-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .status-ok { background: rgba(12,163,12,0.12); color: var(--good); }
  .status-warn { background: rgba(250,178,25,0.15); color: #8a5a00; }
  .status-err { background: rgba(208,59,59,0.12); color: var(--critical); }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-state .big { font-size: 40px; margin-bottom: 10px; }
  .updated-note { font-size: 12px; color: var(--text-muted); margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Search Console — сводка по доменам</h1>
      <div class="sub"><a class="back" href="index.html">&larr; к основному отчёту</a></div>
    </div>
    <select id="domain-select"></select>
  </header>

  <div id="content"></div>
  <div class="updated-note" id="updated-note"></div>
</div>

<script>
let DATA = null;

function fmtInt(n) { return Math.round(n).toLocaleString("ru-RU"); }
function fmtPct(n) { return (n * 100).toFixed(2).replace(".", ",") + "%"; }
function fmtPos(n) { return n.toFixed(1).replace(".", ","); }

function buildTrendSVG(daily, key, color) {
  const w = 560, h = 150, pad = 6;
  if (!daily.length) return '<div class="empty-state" style="padding:30px;">Нет данных за период</div>';
  const vals = daily.map(d => d[key]);
  const max = Math.max(...vals, 1);
  const stepX = (w - pad * 2) / Math.max(daily.length - 1, 1);
  const pts = daily.map((d, i) => {
    const x = pad + i * stepX;
    const y = h - pad - (d[key] / max) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0].toFixed(1)},${h - pad} L${pts[0][0].toFixed(1)},${h - pad} Z`;
  return `<svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path class="trend-area" d="${area}" fill="${color}"></path>
    <path class="trend-line" d="${line}" stroke="${color}"></path>
  </svg>`;
}

function sitemapStatus(sm) {
  if (sm.errors > 0) return `<span class="status-pill status-err">${sm.errors} ошибок</span>`;
  if (sm.warnings > 0) return `<span class="status-pill status-warn">${sm.warnings} warnings</span>`;
  return `<span class="status-pill status-ok">OK</span>`;
}

function renderDomain(domain) {
  const d = DATA.domains[domain];
  const content = document.getElementById("content");
  if (!d || !d.daily || d.daily.length === 0) {
    content.innerHTML = `<div class="card"><div class="empty-state"><div class="big">🔒</div>
      Нет данных Search Console для <b>${domain}</b> — либо нет доступа (verification pending),
      либо реального трафика из поиска пока нет.</div></div>`;
    return;
  }

  const t = d.totals;
  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Клики (91 день)</div><div class="kpi-value">${fmtInt(t.clicks)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Показы (91 день)</div><div class="kpi-value">${fmtInt(t.impressions)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Средний CTR</div><div class="kpi-value">${fmtPct(t.ctr)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Средняя позиция</div><div class="kpi-value">${fmtPos(t.position)}</div></div>
    </div>

    <div class="card">
      <h2>Динамика по дням</h2>
      <div class="charts-row">
        <div>
          <div class="chart-title">Клики</div>
          ${buildTrendSVG(d.daily, "clicks", "var(--series-1)")}
        </div>
        <div>
          <div class="chart-title">Показы</div>
          ${buildTrendSVG(d.daily, "impressions", "var(--series-3)")}
        </div>
      </div>
    </div>

    <div class="tables-row">
      <div class="card">
        <h2>Топ запросов</h2>
        <table><thead><tr><th>Запрос</th><th class="num">Клики</th><th class="num">CTR</th></tr></thead>
        <tbody>${d.top_queries.map(q => `<tr><td>${q.query}</td><td class="num">${fmtInt(q.clicks)}</td><td class="num">${fmtPct(q.ctr)}</td></tr>`).join("")}</tbody></table>
      </div>
      <div class="card">
        <h2>Топ страниц</h2>
        <table><thead><tr><th>Страница</th><th class="num">Клики</th><th class="num">CTR</th></tr></thead>
        <tbody>${d.top_pages.map(p => `<tr><td>${p.page.replace(/^https?:\/\/[^/]+/, "")}</td><td class="num">${fmtInt(p.clicks)}</td><td class="num">${fmtPct(p.ctr)}</td></tr>`).join("")}</tbody></table>
      </div>
    </div>

    <div class="card">
      <h2>Sitemaps</h2>
      <table><thead><tr><th>Путь</th><th>Статус</th><th>Последнее чтение</th></tr></thead>
      <tbody>${d.sitemaps.length ? d.sitemaps.map(sm => `<tr><td>${sm.path}</td><td>${sitemapStatus(sm)}</td><td>${sm.lastDownloaded ? new Date(sm.lastDownloaded).toLocaleDateString("ru-RU") : "—"}</td></tr>`).join("") : '<tr><td colspan="3" style="color:var(--text-muted);">Sitemap не подан</td></tr>'}</tbody></table>
    </div>
  `;
}

async function init() {
  const resp = await fetch("data/searchconsole.json");
  DATA = await resp.json();

  const select = document.getElementById("domain-select");
  Object.keys(DATA.domains).forEach(domain => {
    const opt = document.createElement("option");
    opt.value = domain;
    opt.textContent = domain + " — " + DATA.domains[domain].geo;
    select.appendChild(opt);
  });
  select.addEventListener("change", () => renderDomain(select.value));

  const params = new URLSearchParams(location.search);
  const initial = params.get("site") && DATA.domains[params.get("site")] ? params.get("site") : Object.keys(DATA.domains)[0];
  select.value = initial;
  renderDomain(initial);

  document.getElementById("updated-note").textContent =
    "Данные за " + DATA.start_date + " — " + DATA.end_date + " · обновлено " + new Date(DATA.generated_at).toLocaleString("ru-RU");
}
init();
</script>
</body>
</html>
