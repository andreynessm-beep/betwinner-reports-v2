<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>betwinner.com — отчёт по веб-аналитике</title>
<style>
  :root {
    color-scheme: light;
    --surface-1: #ffffff;
    --page: #f2f4f8;
    --text-primary: #0b1220;
    --text-secondary: #52596b;
    --text-muted: #8a90a3;
    --grid: #e6e9f0;
    --baseline: #c3c2b7;
    --border: rgba(11,18,32,0.08);
    --card-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 6px 20px rgba(15,23,42,0.06);
    --card-shadow-hover: 0 4px 10px rgba(15,23,42,0.06), 0 14px 34px rgba(15,23,42,0.10);
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-other: #8a90a3;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --seq-250: #86b6ef;
    --seq-350: #5598e7;
    --seq-450: #2a78d6;
    --seq-550: #1c5cab;
    --brand-a: #2a78d6;
    --brand-b: #6d4ae0;
    --page-glow: radial-gradient(1200px 480px at 12% -10%, rgba(42,120,214,0.10), transparent 60%),
                 radial-gradient(900px 420px at 95% 0%, rgba(109,74,224,0.08), transparent 55%);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { min-height: 100vh; background-image: var(--page-glow); background-attachment: fixed; }

  /* transition + class-toggle, not @keyframes — driven by style diffing rather
     than the animation timeline, so it can't get stuck mid-way */
  .reveal { opacity: 0; transform: translateY(10px); transition: opacity .45s cubic-bezier(.2,.7,.3,1), transform .45s cubic-bezier(.2,.7,.3,1); }
  .reveal.revealed { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
  }

  /* ---------- password gate ---------- */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(900px 500px at 15% 10%, rgba(42,120,214,0.35), transparent 60%),
      radial-gradient(900px 500px at 85% 90%, rgba(109,74,224,0.30), transparent 60%),
      linear-gradient(160deg, #0b1220, #131b31 55%, #0b1220);
  }
  #gate.hidden { display: none; }
  .gate-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    padding: 40px 32px;
    width: 100%; max-width: 360px;
    text-align: center;
    animation: revealUp .6s cubic-bezier(.2,.7,.3,1) both;
  }
  .gate-logo { margin: 0 auto 18px; }
  .gate-card h1 { font-size: 18px; margin: 0 0 6px; color: #fff; }
  .gate-card p { font-size: 13px; color: rgba(255,255,255,0.6); margin: 0 0 20px; }
  .gate-card input {
    width: 100%; padding: 12px 14px; font-size: 14px;
    border: 1px solid rgba(255,255,255,0.16); border-radius: 10px;
    background: rgba(255,255,255,0.06); color: #fff;
    margin-bottom: 12px; outline: none; transition: border-color .15s, background .15s;
  }
  .gate-card input::placeholder { color: rgba(255,255,255,0.35); }
  .gate-card input:focus { border-color: var(--brand-a); background: rgba(255,255,255,0.1); }
  .gate-card button {
    width: 100%; padding: 12px 14px; font-size: 14px; font-weight: 700;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    color: #fff; cursor: pointer;
    box-shadow: 0 8px 20px rgba(42,120,214,0.35);
    transition: transform .15s, box-shadow .15s;
  }
  .gate-card button:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(42,120,214,0.45); }
  .gate-card button:active { transform: translateY(0); }
  .gate-error { color: #ff8a8a; font-size: 12px; margin-top: 12px; min-height: 16px; }

  /* ---------- app shell ---------- */
  #app { display: none; max-width: 1120px; margin: 0 auto; padding: 0 20px 60px; }
  #app.visible { display: block; }

  header.report-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    margin: 0 -20px 24px; padding: 26px 20px 28px;
    background: linear-gradient(120deg, #0b1220 0%, #16223f 55%, #221a45 100%);
    border-radius: 0 0 20px 20px;
    box-shadow: 0 10px 30px rgba(11,18,32,0.18);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo-mark {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    box-shadow: 0 6px 18px rgba(42,120,214,0.4), inset 0 1px 0 rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px; color: #fff; letter-spacing: -0.5px;
  }
  header.report-header h1 { font-size: 20px; margin: 0; color: #fff; font-weight: 700; }
  header.report-header .sub { font-size: 12.5px; color: rgba(255,255,255,0.55); margin-top: 4px; }
  header.report-header .sub b { color: rgba(255,255,255,0.92); font-weight: 600; }
  .period-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.14);
    color: #fff; font-size: 12px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap;
  }
  .period-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: #34e08a; box-shadow: 0 0 0 3px rgba(52,224,138,0.25); }
  .header-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select.top-select {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16);
    color: #fff; font-size: 12.5px; font-weight: 600;
    padding: 8px 12px; border-radius: 999px; cursor: pointer; appearance: none;
    -webkit-appearance: none;
  }
  select.top-select:hover { background: rgba(255,255,255,0.14); }
  select.top-select option { color: #111; background: #fff; }
  .site-lite-note {
    display: flex; align-items: center; gap: 10px; padding: 14px 18px; margin-bottom: 20px;
    background: color-mix(in srgb, var(--series-4) 12%, transparent); border: 1px solid color-mix(in srgb, var(--series-4) 35%, transparent);
    border-radius: 12px; font-size: 13px; color: var(--text-secondary);
  }
  .period-picker { margin-bottom: 22px; }
  .period-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .period-pill {
    padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    background: var(--surface-1); border: 1.5px solid var(--border); color: var(--text-secondary);
    cursor: pointer; white-space: nowrap; transition: background .15s, color .15s, border-color .15s;
  }
  .period-pill:hover { border-color: var(--brand-a); color: var(--text-primary); }
  .period-pill.active { background: var(--brand-a); border-color: var(--brand-a); color: #fff; }
  .period-pill:disabled { opacity: .35; cursor: not-allowed; }
  .period-pill:disabled:hover { border-color: var(--border); color: var(--text-secondary); }
  #period-row-days .period-pill { padding: 6px 10px; min-width: 34px; text-align: center; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin-bottom: 24px; position: relative; }
  .tab-btn {
    padding: 10px 18px; font-size: 14px; font-weight: 600;
    background: none; border: none; cursor: pointer;
    color: var(--text-secondary);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .15s;
    border-radius: 8px 8px 0 0;
  }
  .tab-btn.active { color: var(--brand-a); border-bottom-color: var(--brand-a); }
  .tab-btn:hover:not(.active) { color: var(--text-primary); background: rgba(42,120,214,0.06); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .note-banner {
    background: var(--surface-1); border: 1px solid var(--border); border-left: 3px solid var(--warning);
    border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--text-secondary);
    margin-bottom: 20px; line-height: 1.5;
  }
  .note-banner b { color: var(--text-primary); }
  .note-banner.small { font-size: 12px; padding: 10px 14px; margin: 0 0 14px; }

  /* ---------- executive summary ---------- */
  .exec-summary {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; box-shadow: var(--card-shadow); margin-bottom: 22px;
  }
  .exec-summary h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .03em; color: var(--text-muted); margin: 0 0 12px; font-weight: 700; }
  .exec-summary ul { margin: 0; padding: 0 0 0 20px; }
  .exec-summary li { font-size: 14px; line-height: 1.6; margin-bottom: 8px; color: var(--text-primary); }
  .exec-summary li:last-child { margin-bottom: 0; }
  .exec-summary li b { color: var(--series-1); }

  .section-title { font-size: 15px; font-weight: 700; margin: 28px 0 12px; }
  .section-title .hint { font-weight: 400; font-size: 12px; color: var(--text-muted); margin-left: 6px; }
  .subsection-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; color: var(--text-muted); margin: 0 0 10px; }

  /* ---------- filter bar ---------- */
  .filter-bar { display: flex; flex-wrap: nowrap; gap: 10px; margin: 22px 0 18px; align-items: center; }
  .filter-field { position: relative; flex: 1 1 0; min-width: 0; }
  .filter-select {
    appearance: none; -webkit-appearance: none; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 10px;
    padding: 8px 34px 8px 12px; font-size: 13px; font-weight: 600; color: var(--text-primary);
    box-shadow: var(--card-shadow); width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: border-color .15s, box-shadow .15s;
  }
  .filter-select:hover { border-color: var(--brand-a); }
  .filter-select:focus-visible { outline: 2px solid var(--brand-a); outline-offset: 1px; }
  .filter-field::after {
    content: "▾"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 11px; pointer-events: none;
  }
  .filter-field.active .filter-select { border-color: var(--brand-a); background: color-mix(in srgb, var(--brand-a) 5%, var(--surface-1)); }
  .filter-clear {
    flex: 0 0 auto;
    font-size: 12px; font-weight: 700; color: var(--brand-a); background: none; border: none; cursor: pointer;
    padding: 8px 6px; opacity: 0; pointer-events: none; transition: opacity .15s;
  }
  .filter-clear.show { opacity: 1; pointer-events: auto; }
  .filter-clear:hover { text-decoration: underline; }

  .funnel-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .funnel-toggle-btn {
    font-size: 12.5px; font-weight: 700; padding: 7px 14px; border-radius: 999px;
    border: 1.5px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
    cursor: pointer; transition: all .15s;
  }
  .funnel-toggle-btn:hover { border-color: var(--brand-a); color: var(--text-primary); }
  .funnel-toggle-btn.active { background: var(--brand-a); border-color: var(--brand-a); color: #fff; }

  /* ---------- KPI tiles ---------- */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  @media (max-width: 860px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .kpi-grid { grid-template-columns: 1fr; } }
  .kpi-grid .kpi-tile:nth-child(1) { transition-delay: .02s; }
  .kpi-grid .kpi-tile:nth-child(2) { transition-delay: .08s; }
  .kpi-grid .kpi-tile:nth-child(3) { transition-delay: .14s; }
  .kpi-grid .kpi-tile:nth-child(4) { transition-delay: .20s; }
  .kpi-grid .kpi-tile:nth-child(5) { transition-delay: .26s; }
  .kpi-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--card-shadow); position: relative; cursor: default;
    overflow: hidden; transition: transform .18s ease, box-shadow .18s ease;
  }
  .kpi-tile:hover { transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
  .kpi-tile::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: var(--kpi-accent, var(--brand-a));
  }
  .kpi-tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .kpi-icon {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--kpi-accent, var(--brand-a)) 14%, transparent);
    color: var(--kpi-accent, var(--brand-a));
  }
  .kpi-icon svg { width: 16px; height: 16px; }
  .kpi-tile .kpi-label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .kpi-tile .kpi-value { font-size: 28px; font-weight: 800; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .kpi-tile .kpi-value.dim { color: var(--text-muted); font-size: 15px; font-weight: 600; }
  .kpi-tile .kpi-sub { font-size: 12px; color: var(--text-secondary); margin-top: 3px; font-variant-numeric: tabular-nums; }
  .info-dot {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--grid); color: var(--text-secondary);
    font-size: 10px; font-weight: 700; cursor: help;
  }

  /* ---------- cards ---------- */
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; box-shadow: var(--card-shadow);
  }
  .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 720px) { .chart-row, .two-col { grid-template-columns: 1fr; } }

  .legend { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: default; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  .legend-label { color: var(--text-primary); flex: 1; }
  .legend-value { color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  /* ---------- ranked bars ---------- */
  .bar-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: grid; grid-template-columns: 160px 1fr 70px; align-items: center; gap: 10px; font-size: 12px; }
  .bar-row.compact { grid-template-columns: 120px 1fr 60px; }
  .bar-track { background: var(--grid); border-radius: 6px; height: 22px; overflow: hidden; cursor: default; }
  .bar-fill {
    height: 100%; border-radius: 6px; width: 0 !important; transition: width .8s cubic-bezier(.2,.8,.2,1);
    background: linear-gradient(90deg, var(--brand-a), #4c9be8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .bar-fill.animate-in { width: var(--target-w, 0%) !important; }
  .bar-count { text-align: right; font-variant-numeric: tabular-nums; color: var(--text-secondary); font-weight: 600; }
  .bar-row-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-primary); }
  .bar-row.expandable .bar-row-label { cursor: pointer; color: var(--brand-a); text-decoration: underline dotted; font-weight: 600; }
  .bar-sub-list {
    display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease;
    margin: 0 0 0 0; padding-left: 12px; border-left: 2px solid var(--grid);
  }
  .bar-sub-list > div { overflow: hidden; }
  .bar-sub-list.open { grid-template-rows: 1fr; margin: 2px 0 4px 0; }

  /* ---------- visual funnel (continuous layered "3D" cone, matches reference) ---------- */
  .vfunnel2 { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: stretch; }
  .vfunnel2-labels { display: grid; gap: 8px; }
  .vfunnel-label-chip {
    display: flex; align-items: center; padding: 0 14px; border-radius: 10px;
    color: #fff; font-size: 13px; font-weight: 700; line-height: 1.25;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.08);
  }
  .vfunnel2-graphic { position: relative; }
  .vfunnel-svg {
    width: 100%; height: auto; display: block; overflow: visible;
    animation: vfunnelGlow 3.6s ease-in-out infinite;
    transition: filter .25s ease;
  }
  .vfunnel2-graphic:hover .vfunnel-svg { filter: drop-shadow(0 0 22px rgba(90,91,224,0.5)) brightness(1.05); }
  @keyframes vfunnelGlow {
    0%, 100% { filter: drop-shadow(0 2px 10px rgba(15,23,42,0.12)); }
    50% { filter: drop-shadow(0 6px 22px rgba(90,91,224,0.30)); }
  }
  .vfunnel-poly { transform: scaleY(0); transform-origin: center top; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .vfunnel-poly.animate-in { transform: scaleY(1); }
  .vfunnel-cap { opacity: 0; transition: opacity .3s ease; }
  .vfunnel-cap.animate-in { opacity: 1; }
  .vfunnel-value-text {
    fill: #fff; font-weight: 800; font-size: 16px; text-anchor: middle; dominant-baseline: middle;
    paint-order: stroke; stroke: rgba(0,0,0,0.18); stroke-width: 3px; stroke-linejoin: round;
    opacity: 0; transition: opacity .3s ease;
  }
  .vfunnel-value-text.animate-in { opacity: 1; }

  .vfunnel-pill {
    position: absolute; left: 50%; display: inline-flex; align-items: center; gap: 4px;
    background: var(--surface-1); border: 1.5px solid var(--border); border-radius: 999px;
    padding: 3px 11px; font-size: 11.5px; font-weight: 800; color: var(--text-primary);
    box-shadow: 0 3px 10px rgba(15,23,42,0.14);
    transform: translate(-50%, -50%) scale(0); transition: transform .35s cubic-bezier(.34,1.56,.64,1);
    z-index: 2; white-space: nowrap;
  }
  .vfunnel-pill.animate-in { transform: translate(-50%, -50%) scale(1); }
  .vfunnel-pill .arrow { color: var(--text-muted); font-size: 9px; }

  /* ---------- line/trend chart ---------- */
  .trend-wrap { display: flex; flex-direction: column; }
  .trend-svg { width: 100%; height: auto; }
  .trend-axis-label { font-size: 10px; fill: var(--text-muted); }
  .trend-value-label {
    font-size: 10.5px; font-weight: 700; fill: var(--text-primary);
    paint-order: stroke; stroke: var(--surface-1); stroke-width: 3px; stroke-linejoin: round;
  }

  /* ---------- generic data table ---------- */
  table.data-table, table.events-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th, table.events-table th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .02em;
    color: var(--text-muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--grid);
    white-space: nowrap;
  }
  table.data-table td, table.events-table td { padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; transition: background .12s; }
  table.data-table tr:last-child td, table.events-table tr:last-child td { border-bottom: none; }
  table.data-table .num, table.events-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.data-table td.name-cell { max-width: 320px; overflow-wrap: anywhere; }
  table.data-table tbody tr:not(.group-row):not(.sub-row):nth-child(even) td,
  table.events-table tbody tr:not(.detail-row):nth-child(even) td { background: color-mix(in srgb, var(--brand-a) 2.5%, transparent); }
  table.data-table tbody tr:hover td, table.events-table tbody tr:hover td { background: color-mix(in srgb, var(--brand-a) 6%, transparent); }
  tr.zero-row { opacity: 0.5; }
  tr.group-row td { font-weight: 700; background: color-mix(in srgb, var(--brand-a) 4%, var(--page)); }
  tr.sub-row td.name-cell { padding-left: 26px; color: var(--text-secondary); font-weight: 400; font-size: 12px; }
  .event-name-cell { display: flex; align-items: center; gap: 6px; cursor: default; }
  .event-name-cell.expandable { cursor: pointer; }
  .event-name-cell.expandable .event-label { color: var(--series-1); text-decoration: underline dotted; }
  .chevron { font-size: 9px; color: var(--text-muted); transition: transform .15s; display: inline-block; }
  .chevron.open { transform: rotate(90deg); }
  .event-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--text-muted); }
  .event-desc { color: var(--text-secondary); }
  .zero-tag { font-size: 10px; color: var(--text-muted); background: var(--grid); padding: 2px 6px; border-radius: 4px; }
  .detail-row td { background: var(--page); padding: 4px 10px 10px 30px; }
  .detail-list { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .detail-list .drow { display: flex; justify-content: space-between; gap: 12px; }
  .detail-list .dval { color: var(--text-secondary); }

/* ===================== password gate ===================== */
// Temporarily disabled by request -- gate code/markup left intact, just
// force-unlocked on load. To re-enable, delete this line.
sessionStorage.setItem("bw_unlocked", "1");
const PASS_HASH = "979ca6be98edebc04c18e7b2b0ed7f321762a1e5f329d58ea4f0c57511468b32";
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function tryUnlock() {
  const val = document.getElementById("gate-pass").value;
  const hash = await sha256Hex(val);
  if (hash === PASS_HASH) {
    sessionStorage.setItem("bw_unlocked", "1");
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("app").classList.add("visible");
    initReport();
  } else {
    document.getElementById("gate-error").textContent = "Неверный пароль";
  }
}
document.getElementById("gate-btn").addEventListener("click", tryUnlock);
document.getElementById("gate-pass").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
if (sessionStorage.getItem("bw_unlocked") === "1") {
  document.getElementById("gate").classList.add("hidden");

}

const ttEl = document.getElementById("tt");
function showTip(x, y, title, body) {
  ttEl.innerHTML = "";
  const t = document.createElement("div"); t.className = "tt-title"; t.textContent = title;
  ttEl.appendChild(t);
  if (body) { const b = document.createElement("div"); b.textContent = body; ttEl.appendChild(b); }
  ttEl.style.left = Math.min(x + 14, window.innerWidth - 280) + "px";
  ttEl.style.top = (y + 14) + "px";
  ttEl.classList.add("show");
}
function hideTip() { ttEl.classList.remove("show"); }
function bindTip(el, title, body) {
  el.addEventListener("pointermove", e => showTip(e.clientX, e.clientY, title, body));
  el.addEventListener("pointerleave", hideTip);
  el.addEventListener("focus", e => { const r = el.getBoundingClientRect(); showTip(r.left, r.bottom, title, body); });
  el.addEventListener("blur", hideTip);
}

const fmtInt = n => new Intl.NumberFormat("ru-RU").format(Math.round(n));
// Compact axis/point-label form (273436 -> "273K") -- full fmtInt numbers
// ("273 436") crowd two adjacent point labels on a chart into each other.
const fmtCompact = n => {
  const v = Math.round(n);
  if (Math.abs(v) >= 1000000) return (v/1000000).toFixed(v % 1000000 === 0 ? 0 : 1).replace(".", ",") + "M";
  if (Math.abs(v) >= 1000) return (v/1000).toFixed(v % 1000 === 0 ? 0 : 1).replace(".", ",") + "K";
  return String(v);
};
// form_start (GA4 auto-detected, can fire more than once per session) isn't a
// strict 1:1 step against sign_up_start, so the ratio can mathematically exceed
// 100% — clamp the display since a conversion rate can't exceed 100% by definition.
const fmtPct = n => (Math.round(Math.min(n, 100) * 10) / 10).toString().replace(".", ",") + "%";

// The site's registration-method labels are captured in whatever language the
// visitor is browsing in ("By phone", "Por telefono", "از طریق تلفن", ...) —
// classify by keyword (checking specific social network names first, since
// e.g. "Mail.Ru" contains "mail" but is a social login, not the email method)
// and re-aggregate counts into one Russian bucket per real method.
function normalizeMethodDetail(rawDetail) {
  const SOCIAL_NETWORK_NAMES = ["telegram", "vkontakte", " vk", "vk.", "одноклассник", "ok.ru", "yandex", "яндекс", "mail.ru", "whatsapp", "viber"];
  function classify(raw) {
    const s = (raw || "").toLowerCase();
    if (SOCIAL_NETWORK_NAMES.some(n => s.includes(n))) return "Соцсети и мессенджеры";
    if (s === "fast" || s.includes("clic") || s.includes("click") || s.includes("1 клик") || s.includes("одним кликом")) return "В 1 клик";
    if (s === "phone" || s.includes("phone") || s.includes("tel") || s.includes("телефон") || s.includes("تلفن")) return "По телефону";
    if (s === "email" || s.includes("mail") || s.includes("почт")) return "По E-mail";
    if (s.includes("social") || s.includes("sociales") || s.includes("mensaj") || s.includes("соцсет") || s.includes("messeng")) return "Соцсети и мессенджеры";
    // "unknown" is a real value the site itself sends (not a tracking gap) --
    // same meaning as GA's own "(not set)". Anything else unrecognized also
    // folds in here rather than a separate "Другое" bucket -- if we can't
    // name the method, say so plainly instead of a vague catch-all label.
    return "Не определено";
  }
  const buckets = {};
  rawDetail.forEach(d => {
    const key = classify(d.value);
    buckets[key] = (buckets[key] || 0) + (d.count || 0);
  });
  return Object.entries(buckets)
    .map(([value, count]) => ({ value, count }))
    .sort((a, b) => b.count - a.count);
}

// app_download_click's "platform" shows up in whatever language the visitor's
// site is in ("Android", "안드로이드", "iOS", "آيفون", ...) — collapse to two
// canonical buckets since there are only ever two real mobile platforms.
function normalizePlatformDetail(rawDetail) {
  function classify(raw) {
    const s = (raw || "").toLowerCase();
    if (s === "(not set)" || s === "(none)" || !s) return "Не определено";
    if (s.includes("android") || s.includes("안드로이드") || s.includes("андроид")) return "Android";
    if (s.includes("ios") || s.includes("iphone") || s.includes("айфон") || s.includes("آيفون")) return "iOS";
    return "Другое";
  }
  const buckets = {};
  rawDetail.forEach(d => {
    const key = classify(d.value);
    buckets[key] = (buckets[key] || 0) + (d.count || 0);
  });
  return Object.entries(buckets)
    .map(([value, count]) => ({ value, count }))
    .sort((a, b) => b.count - a.count);
}

// social_footer_click/login_social_click values are branded redirect links
// (e.g. http://smbwtg.xyz/ — "smbw" + 2-letter platform code + .xyz), not
// readable names. Decode by the 2-letter code, falling back to matching the
// real platform domain directly (e.g. vk.com links that skip the redirector).
function normalizeSocialDetail(rawDetail) {
  const CODE_TO_NAME = { tg: "Telegram", vk: "VK", ig: "Instagram", fb: "Facebook", tw: "X (Twitter)", ok: "Одноклассники", wa: "WhatsApp", yt: "YouTube" };
  function classify(raw) {
    const s = (raw || "").toLowerCase();
    if (s === "(not set)" || s === "(none)" || !s) return "Не определено";
    const shortlinkMatch = s.match(/smbw([a-z]{2})\.xyz/);
    if (shortlinkMatch && CODE_TO_NAME[shortlinkMatch[1]]) return CODE_TO_NAME[shortlinkMatch[1]];
    if (s.includes("vk.com") || s.includes("vkontakte")) return "VK";
    if (s.includes("t.me") || s.includes("telegram")) return "Telegram";
    if (s.includes("instagram.com")) return "Instagram";
    if (s.includes("facebook.com")) return "Facebook";
    if (s.includes("twitter.com") || s.includes("x.com")) return "X (Twitter)";
    if (s.includes("ok.ru") || s.includes("одноклассник")) return "Одноклассники";
    if (s.includes("whatsapp")) return "WhatsApp";
    if (s.includes("mail.ru")) return "Mail.Ru";
    if (s.includes("yandex") || s.includes("яндекс")) return "Яндекс";
    return "Другое";
  }
  const buckets = {};
  rawDetail.forEach(d => {
    const key = classify(d.value);
    buckets[key] = (buckets[key] || 0) + (d.count || 0);
  });
  return Object.entries(buckets)
    .map(([value, count]) => ({ value, count }))
    .sort((a, b) => b.count - a.count);
}

// Counts a number up from 0 to target — the "wow, it's alive" first-load moment.
// Respects prefers-reduced-motion by jumping straight to the final value.
const REDUCE_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateCount(el, target, opts) {
  opts = opts || {};
  const fmt = opts.format || fmtInt;
  if (REDUCE_MOTION || target === 0) { el.textContent = fmt(target); return; }
  const duration = opts.duration || 900;
  const delay = opts.delay || 0;
  const stepMs = 16;
  const ease = t => 1 - Math.pow(1 - t, 3);
  // setTimeout, not requestAnimationFrame — rAF only fires while the tab is
  // actively compositing frames; setTimeout runs regardless, so the count-up
  // can't silently stall on a backgrounded/non-visible tab.
  setTimeout(() => {
    const start = performance.now();
    function tick() {
      const t = Math.min((performance.now() - start) / duration, 1);
      el.textContent = fmt(target * ease(t));
      if (t < 1) setTimeout(tick, stepMs); else el.textContent = fmt(target);
    }
    tick();
  }, delay);
}
function topNPlusOther(rows, n, valueKey) {
  const sorted = (rows||[]).slice().sort((a,b) => b[valueKey]-a[valueKey]);
  const top = sorted.slice(0, n);
  const rest = sorted.slice(n);
  const restSum = rest.reduce((s,r) => s+r[valueKey], 0);
  const out = top.map(r => ({ name: r.name, value: r[valueKey] }));
  if (restSum > 0) out.push({ name: `Остальные (${rest.length})`, value: restSum, isOther: true });
  return out;
}

// A closed-by-default <details> section — progressive disclosure so the top of
// the report stays to 5-9 headline items (dashboard design: "one decision per
// screen", detail is a click away, not competing for attention).
function collapsibleSection(parent, title, hint) {
  const wrap = document.createElement("div"); wrap.className = "section-collapse";
  const header = document.createElement("button"); header.className = "section-collapse-header"; header.type = "button";
  header.setAttribute("aria-expanded", "false");
  const chev = document.createElement("span"); chev.className = "chevron-ico"; chev.textContent = "▸";
  const t = document.createElement("span"); t.textContent = title;

  const animate = document.createElement("div"); animate.className = "section-collapse-animate";
  const body = document.createElement("div"); body.className = "section-collapse-body";
  animate.appendChild(body);
  header.addEventListener("click", () => {
    const open = wrap.classList.toggle("open");
    header.setAttribute("aria-expanded", String(open));
  });
  wrap.append(header, animate);
  parent.appendChild(wrap);
  return body;
}

/* ===================== chart builders ===================== */
function buildDonut(entries) {
  const size = 200, r = 80, cx = size/2, cy = size/2, stroke = 28;
  const total = entries.reduce((s,e) => s+e.value, 0) || 1;
  let angle = -90;
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${size} ${size}`);
  svg.setAttribute("width", "100%");
  svg.style.maxWidth = "180px";
  svg.style.height = "auto";

  entries.forEach((e) => {
    const frac = e.value / total;
    const a0 = angle, a1 = angle + frac*360;
    angle = a1;
    const large = (a1 - a0) > 180 ? 1 : 0;
    const toXY = a => [cx + r*Math.cos(a*Math.PI/180), cy + r*Math.sin(a*Math.PI/180)];
    const [x0,y0] = toXY(a0), [x1,y1] = toXY(a1);
    const path = document.createElementNS(svgNS, "path");
    const d = frac >= 0.9995
      ? `M ${cx-r} ${cy} A ${r} ${r} 0 1 1 ${cx+r-0.01} ${cy} A ${r} ${r} 0 1 1 ${cx-r} ${cy}`
      : `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
    path.setAttribute("d", d);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", e.color);
    path.setAttribute("stroke-width", stroke);
    path.style.cursor = "default";
    path.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY, e.label, `${fmtInt(e.value)} (${(frac*100).toFixed(1)}%)`));
    path.addEventListener("pointerleave", hideTip);
    svg.appendChild(path);
  });

  const wrap = document.createElement("div");
  wrap.style.display = "flex"; wrap.style.flexDirection = "column"; wrap.style.alignItems = "center";
  wrap.appendChild(svg);
  return wrap;
}

function buildLegend(entries) {
  const wrap = document.createElement("div"); wrap.className = "legend";
  entries.forEach(e => {
    const row = document.createElement("div"); row.className = "legend-item"; row.tabIndex = 0;
    const sw = document.createElement("span"); sw.className = "legend-swatch"; sw.style.background = e.color;
    const lab = document.createElement("span"); lab.className = "legend-label"; lab.textContent = e.label;
    const val = document.createElement("span"); val.className = "legend-value"; val.textContent = fmtInt(e.value);
    row.append(sw, lab, val);
    const glossaryDesc = GLOSSARY[e.name] ? GLOSSARY[e.name].desc : (e.tip || "");
    bindTip(row, e.label, glossaryDesc);
    wrap.appendChild(row);
  });
  return wrap;
}

function donutBlock(title, rawRows, valueKey) {
  const wrap = document.createElement("div");
  const t = document.createElement("div"); t.className = "subsection-title"; t.textContent = title;
  wrap.appendChild(t);

// Real visual funnel — tapering trapezoid segments, single sequential hue (dataviz: ordinal ramp for stages/tiers)
// Colorful layered funnel (blue -> deep purple), value printed inside each
// segment, label as a matching solid chip on the left — bright and legible,
// closer to how commercial BI funnel charts read at a glance.
const FUNNEL_STAGE_COLORS = [
  { base: "#2a78d6", top: "#5a9eef" }, // blue
  { base: "#5a5be0", top: "#8686f0" }, // blue-violet
  { base: "#7d4fd6", top: "#a67cec" }, // violet
  { base: "#5b3aa7", top: "#8163c9" }, // deep purple
];

// Continuous layered funnel — one shape, not N separate cards, matching the
// reference: color-chip labels on the left, an unbroken "stacked discs" cone
// with the value inside each band, on the right.
function buildVisualFunnel(steps) {
  const n = steps.length;
  const svgNS = "http://www.w3.org/2000/svg";
  const trackW = 260, rowH = 36, totalH = n * rowH, capRy = 5;

  const outer = document.createElement("div"); outer.className = "vfunnel2";
  const labels = document.createElement("div"); labels.className = "vfunnel2-labels";
  labels.style.gridTemplateRows = `repeat(${n}, 1fr)`;
  const graphic = document.createElement("div"); graphic.className = "vfunnel2-graphic";

  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${trackW} ${totalH}`);
  svg.classList.add("vfunnel-svg");
  svg.setAttribute("preserveAspectRatio", "none");
  const defs = document.createElementNS(svgNS, "defs");
  svg.appendChild(defs);

  // Fixed geometric taper, not scaled to the real values: real funnel drop-offs
  // often span 3-4 orders of magnitude (24000 -> 1), and a value-proportional
  // width just collapses every stage after the first into an identical sliver.
  // The reference chart does the same — the cone is a consistent visual motif,
  // the real numbers live in the text and in the conversion pills.
  const topRatio = 0.60, shrink = 0.76;
  const boundaryFrac = i => topRatio * Math.pow(shrink, i);
  const widthFor = i => boundaryFrac(i) * trackW;

  steps.forEach((s, i) => {
    const colors = FUNNEL_STAGE_COLORS[Math.min(i, FUNNEL_STAGE_COLORS.length-1)];
    const chip = document.createElement("div"); chip.className = "vfunnel-label-chip";
    chip.style.background = colors.base;
    chip.textContent = s.label;
    labels.appendChild(chip);

    const y0 = i * rowH, y1 = y0 + rowH;
    const topW = widthFor(i);
    const botW = widthFor(i + 1);
    const cx = trackW / 2;
    const tl = cx - topW/2, tr = cx + topW/2, bl = cx - botW/2, br = cx + botW/2;

    const gradId = "vfg" + i + Math.random().toString(36).slice(2,7);
    const grad = document.createElementNS(svgNS, "linearGradient");
    grad.setAttribute("id", gradId); grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0"); grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
    const stop1 = document.createElementNS(svgNS, "stop"); stop1.setAttribute("offset", "0%"); stop1.setAttribute("stop-color", colors.top);
    const stop2 = document.createElementNS(svgNS, "stop"); stop2.setAttribute("offset", "100%"); stop2.setAttribute("stop-color", colors.base);
    grad.append(stop1, stop2); defs.appendChild(grad);

    const poly = document.createElementNS(svgNS, "polygon");
    poly.classList.add("vfunnel-poly");
    poly.style.transformBox = "fill-box"; poly.style.transformOrigin = "50% 0%";
    poly.style.transitionDelay = (i * 200) + "ms";
    poly.setAttribute("points", `${tl},${y0} ${tr},${y0} ${br},${y1} ${bl},${y1}`);
    poly.setAttribute("fill", `url(#${gradId})`);
    svg.appendChild(poly);
    setTimeout(() => poly.classList.add("animate-in"), 20);

    // rim ellipse at the top of every band — the "stacked discs" cue from the reference
    const cap = document.createElementNS(svgNS, "ellipse");
    cap.classList.add("vfunnel-cap");
    cap.style.transitionDelay = (i * 200 + 300) + "ms";
    cap.setAttribute("cx", cx); cap.setAttribute("cy", y0); cap.setAttribute("rx", topW/2); cap.setAttribute("ry", capRy);
    cap.setAttribute("fill", colors.top);
    svg.appendChild(cap);
    setTimeout(() => cap.classList.add("animate-in"), 20);

    if (i === n - 1) {
      const bottomCap = document.createElementNS(svgNS, "ellipse");
      bottomCap.classList.add("vfunnel-cap");
      bottomCap.style.transitionDelay = (i * 200 + 320) + "ms";
      bottomCap.setAttribute("cx", cx); bottomCap.setAttribute("cy", y1); bottomCap.setAttribute("rx", botW/2); bottomCap.setAttribute("ry", capRy);
      bottomCap.setAttribute("fill", colors.base);
      svg.appendChild(bottomCap);
      setTimeout(() => bottomCap.classList.add("animate-in"), 20);
    }

    const valueText = document.createElementNS(svgNS, "text");
    valueText.classList.add("vfunnel-value-text");
    valueText.style.transitionDelay = (i * 200 + 360) + "ms";
    valueText.setAttribute("x", cx); valueText.setAttribute("y", (y0 + y1) / 2 + 2);
    valueText.textContent = "0";
    svg.appendChild(valueText);
    animateCount(valueText, s.value, { delay: i * 200 + 220 });
    setTimeout(() => valueText.classList.add("animate-in"), 20);

    const hit = document.createElementNS(svgNS, "rect");
    hit.setAttribute("x", 0); hit.setAttribute("y", y0); hit.setAttribute("width", trackW); hit.setAttribute("height", rowH);
    hit.setAttribute("fill", "transparent");
    const desc = GLOSSARY[s.name] ? GLOSSARY[s.name].desc : (s.desc || "");
    const crText = (i > 0 && steps[i-1].value > 0) ? fmtPct(s.value / steps[i-1].value * 100) : "";
    const tipBody = (desc ? desc + " " : "") + (crText ? `Конверсия от предыдущего шага: ${crText}.` : "");
    bindTip(hit, s.label, tipBody);
    svg.appendChild(hit);

    if (i > 0 && steps[i-1].value > 0) {
      const pill = document.createElement("div"); pill.className = "vfunnel-pill";
      const cr = fmtPct(s.value / steps[i-1].value * 100);
      pill.innerHTML = `<span class="arrow">&#8595;</span><span>${cr}</span>`;
      pill.style.top = (y0 / totalH * 100) + "%";
      pill.style.transitionDelay = (i * 200 + 500) + "ms";
      graphic.appendChild(pill);
      setTimeout(() => pill.classList.add("animate-in"), 20);
    }
  });

  graphic.appendChild(svg);
  outer.append(labels, graphic);
  return outer;
}

// Ranked horizontal bar list — single hue, magnitude comparison (dataviz: sequential = safe default for "compare magnitude")
// entries: [{label, value, tip}], optional entries[i].subEntries = [{label,value}] for expand-in-place
function buildRankedBars(entries, opts) {
  opts = opts || {};
  // sharedMax lets a nested/expanded sub-list stay on the SAME scale as its parent
  // (a sub-bar must never look bigger than the #1 bar just because it's alone in a small list)
  const localMax = entries.reduce((m,e) => Math.max(m, e.value), 0) || 1;
  const max = opts.sharedMax || localMax;
  const wrap = document.createElement("div"); wrap.className = "bar-list";
  entries.forEach(e => {
    const hasSub = e.subEntries && e.subEntries.length;
    const row = document.createElement("div"); row.className = "bar-row" + (opts.compact ? " compact" : "") + (hasSub ? " expandable" : "");
    const label = document.createElement("div"); label.className = "bar-row-label"; label.textContent = e.label;
    const track = document.createElement("div"); track.className = "bar-track"; track.tabIndex = 0;
    const fill = document.createElement("div"); fill.className = "bar-fill";
    const pct = Math.max((e.value / max) * 100, e.value > 0 ? 2 : 0);
    fill.style.setProperty("--target-w", pct + "%");
    track.appendChild(fill);
    setTimeout(() => fill.classList.add("animate-in"), 20);
    const count = document.createElement("div"); count.className = "bar-count"; count.textContent = fmtInt(e.value);
    row.append(label, track, count);
    bindTip(track, e.label, e.tip || `${fmtInt(e.value)} сессий`);
    wrap.appendChild(row);

    if (hasSub) {
      const sub = document.createElement("div"); sub.className = "bar-sub-list";
      const subInner = document.createElement("div");
      subInner.appendChild(buildRankedBars(e.subEntries, { compact: true, sharedMax: max }));
      sub.appendChild(subInner);
      wrap.appendChild(sub);
      label.addEventListener("click", () => sub.classList.toggle("open"));
    }
  });
  return wrap;
}

// "Nice" round axis step (1/2/5 x10^n) so gridline labels read as 100K/
// 150K/200K instead of arbitrary fractions of the raw data max.
function niceAxisStep(max, targetTicks) {
  if (max <= 0) return 1;
  const raw = max / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
  return step * mag;
}

// Simple line/area chart for a daily trend — sequential single hue (dataviz: "trend over time -> line")
function buildTrendChart(points, key, label, colorVar) {
  colorVar = colorVar || "--brand-a";
  const wrap = document.createElement("div"); wrap.className = "trend-wrap";
  if (points.length === 1) {
    // A line needs 2+ points to connect -- but a single point isn't
    // "missing data" when it's because the user deliberately picked one
    // specific day in the calendar (other days DO exist, just filtered
    // out). Show that one real number as a hero stat instead of an
    // apologetic "не хватает данных" message that doesn't fit that case.
    const hero = document.createElement("div");
    hero.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:36px 0;";
    const val = document.createElement("div");
    val.style.cssText = `font-size:42px;font-weight:700;line-height:1;color:${cssVar(colorVar)};`;
    val.textContent = fmtInt(points[0][key]);
    const sub = document.createElement("div");
    sub.style.cssText = "font-size:13px;color:var(--text-secondary);";
    sub.textContent = `${label} · ${fmtDate(points[0].date)}`;
    hero.append(val, sub);
    wrap.appendChild(hero);
    return wrap;
  }
  if (points.length === 0) {
    const note = document.createElement("div"); note.className = "note-banner small";
    note.innerHTML = `<b>Нет данных за выбранный период.</b> Попробуйте выбрать другой диапазон дат.`;
    wrap.appendChild(note);
    return wrap;
  }
  const W = 640, H = 190, padL = 46, padR = 20, padT = 24, padB = 24;
  const rawMax = Math.max(...points.map(p => p[key]), 1);
  const axisStep = niceAxisStep(rawMax, 4);
  const max = Math.ceil(rawMax / axisStep) * axisStep;
  const xStep = (W - padL - padR) / (points.length - 1);
  const yFor = v => padT + (H - padT - padB) * (1 - v / max);
  const xFor = i => padL + i * xStep;

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.classList.add("trend-svg");

  // Left-hand measurement scale: gridlines at "nice" round steps, with a
  // compact label at each one (100K/150K/...) instead of just a bare 0/max
  // pair -- lets the reader judge the real magnitude, not only the shape.
  for (let v = 0; v <= max + 0.001; v += axisStep) {
    const y = yFor(v);
    const line = document.createElementNS(svgNS, "line");
    line.setAttribute("x1", padL); line.setAttribute("x2", W - padR);
    line.setAttribute("y1", y); line.setAttribute("y2", y);
    line.setAttribute("stroke", cssVar("--grid")); line.setAttribute("stroke-width", "1");
    svg.appendChild(line);
    const axisLabel = document.createElementNS(svgNS, "text");
    axisLabel.setAttribute("x", padL - 8); axisLabel.setAttribute("y", y + 3);
    axisLabel.setAttribute("text-anchor", "end");
    axisLabel.setAttribute("class", "trend-axis-label");
    axisLabel.textContent = fmtCompact(v);
    svg.appendChild(axisLabel);
  }

  const gradId = "trendArea" + Math.random().toString(36).slice(2,7);
  const defs = document.createElementNS(svgNS, "defs");
  const grad = document.createElementNS(svgNS, "linearGradient");
  grad.setAttribute("id", gradId); grad.setAttribute("x1", "0"); grad.setAttribute("y1", "0"); grad.setAttribute("x2", "0"); grad.setAttribute("y2", "1");
  const gs1 = document.createElementNS(svgNS, "stop"); gs1.setAttribute("offset", "0%"); gs1.setAttribute("stop-color", cssVar(colorVar)); gs1.setAttribute("stop-opacity", "0.32");
  const gs2 = document.createElementNS(svgNS, "stop"); gs2.setAttribute("offset", "100%"); gs2.setAttribute("stop-color", cssVar(colorVar)); gs2.setAttribute("stop-opacity", "0");
  grad.append(gs1, gs2); defs.appendChild(grad); svg.appendChild(defs);

  // Catmull-Rom -> cubic-bezier smoothing so the line reads as a smooth curve
  // instead of straight jagged segments once there are 3+ days of data.
  const coords = points.map((p, i) => [xFor(i), yFor(p[key])]);
  const smoothPath = pts => {
    if (pts.length < 3) return "M " + pts.map(c => c.join(",")).join(" L ");
    let d = `M ${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i === 0 ? 0 : i - 1], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C ${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
    }
    return d;
  };
  const smoothD = smoothPath(coords);
  const areaPts = points.map((p,i) => `${xFor(i)},${yFor(p[key])}`).join(" L ");
  const area = document.createElementNS(svgNS, "path");
  area.setAttribute("d", `${smoothD} L ${xFor(points.length-1)},${yFor(0)} L ${xFor(0)},${yFor(0)} Z`);
  area.setAttribute("fill", `url(#${gradId})`);
  area.style.opacity = "0"; area.style.transition = "opacity .6s ease .4s";
  svg.appendChild(area);
  setTimeout(() => { area.style.opacity = "1"; }, 20);

  const line = document.createElementNS(svgNS, "path");
  line.setAttribute("d", smoothD);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", cssVar(colorVar));
  line.setAttribute("stroke-width", "3");
  line.setAttribute("stroke-linejoin", "round");
  line.setAttribute("stroke-linecap", "round");
  svg.appendChild(line);
  // "drawing" animation: dash the full line length, then transition the
  // offset to 0 — a transition, not a CSS animation, so it can't stall
  const len = line.getTotalLength();
  line.style.strokeDasharray = String(len);
  line.style.strokeDashoffset = String(len);
  line.style.transition = "stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)";
  setTimeout(() => { line.style.strokeDashoffset = "0"; }, 20);

  const labelEvery = Math.ceil(points.length / 8);
  // The sparse cadence above is purely index-based, so the single most
  // important point to label (the peak) can land on a skipped index and
  // show no number at all -- always force it in, regardless of cadence.
  const maxIdx = points.reduce((best, p, i) => (p[key] > points[best][key] ? i : best), 0);
  points.forEach((p, i) => {
    const cx = xFor(i), cy = yFor(p[key]);
    const dot = document.createElementNS(svgNS, "circle");
    dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.setAttribute("r", "4");
    dot.setAttribute("fill", cssVar(colorVar));
    dot.setAttribute("stroke", cssVar("--surface-1")); dot.setAttribute("stroke-width", "1.5");
    dot.style.opacity = "0"; dot.style.transformOrigin = `${cx}px ${cy}px`; dot.style.transform = "scale(.3)";
    dot.style.transition = `opacity .3s ease, transform .3s cubic-bezier(.3,1.5,.5,1)`;
    dot.style.transitionDelay = (0.15 + i * (1.0 / points.length)) + "s";
    svg.appendChild(dot);
    setTimeout(() => { dot.style.opacity = "1"; dot.style.transform = "scale(1)"; }, 20);

    // Value label above each point -- but only at the same sparse cadence as
    // the date labels below (every point stopped fitting once the chart grew
    // past ~10 days; with a real Y-axis now drawn, a label on every point
    // isn't load-bearing anymore -- exact values are always one hover away).
    if (i % labelEvery === 0 || i === points.length - 1 || i === maxIdx) {
      const valLabel = document.createElementNS(svgNS, "text");
      valLabel.setAttribute("x", cx); valLabel.setAttribute("y", Math.max(cy - 10, 11));
      // Center-anchored labels on the very first/last point spill sideways
      // past the plot area -- the first one in particular can land right on
      // top of the Y-axis scale labels when its value sits near a gridline.
      // Anchor those two to the point instead of straddling it.
      valLabel.setAttribute("text-anchor", i === 0 ? "start" : (i === points.length - 1 ? "end" : "middle"));
      valLabel.setAttribute("class", "trend-value-label");
      valLabel.textContent = fmtCompact(p[key]);
      valLabel.style.opacity = "0"; valLabel.style.transition = "opacity .3s ease";
      valLabel.style.transitionDelay = (0.25 + i * (1.0 / points.length)) + "s";
      svg.appendChild(valLabel);
      setTimeout(() => { valLabel.style.opacity = "1"; }, 20);
    }

    const hit = document.createElementNS(svgNS, "circle");
    hit.setAttribute("cx", cx); hit.setAttribute("cy", cy); hit.setAttribute("r", "14");
    hit.setAttribute("fill", "transparent"); hit.style.cursor = "default";
    hit.addEventListener("pointermove", ev => showTip(ev.clientX, ev.clientY, fmtDate(p.date), `${label}: ${fmtInt(p[key])}`));
    hit.addEventListener("pointerleave", hideTip);
    svg.appendChild(hit);
    if (i % labelEvery === 0 || i === points.length - 1 || i === maxIdx) {
      const t = document.createElementNS(svgNS, "text");
      t.setAttribute("x", cx); t.setAttribute("y", H - 6); t.setAttribute("text-anchor", "middle");
      t.setAttribute("class", "trend-axis-label");
      t.textContent = fmtDate(p.date);
      svg.appendChild(t);
    }
  });

  wrap.appendChild(svg);
  return wrap;
}

function buildTable(headers, rows, alignRightFrom) {
  const table = document.createElement("table"); table.className = "data-table";
  const thead = document.createElement("thead"); const trh = document.createElement("tr");
  headers.forEach((h, i) => {
    const th = document.createElement("th"); th.textContent = h;
    if (alignRightFrom !== undefined && i >= alignRightFrom) th.style.textAlign = "right";
    trh.appendChild(th);
  });
  thead.appendChild(trh); table.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(cells => {
    const tr = document.createElement("tr");
    cells.forEach((c, i) => {
      const td = document.createElement("td");
      if (i === 0) td.className = "name-cell";
      if (alignRightFrom !== undefined && i >= alignRightFrom) td.className = "num";
      td.textContent = c;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

// Channels + sources merged into ONE grouped table — full text, no truncation
function buildSourceGroupTable(channels, sources) {
  if (!channels || !channels.length) {
    const note = document.createElement("div"); note.className = "note-banner small";
    note.innerHTML = `<b>Нет данных об источниках за выбранный период.</b> Разбивка по источникам собирается только с 17.08.2026 (запуск новой аналитики) — попробуйте выбрать более поздний период.`;
    return note;
  }
  const table = document.createElement("table"); table.className = "data-table";
  const thead = document.createElement("thead");
  thead.innerHTML = `<tr><th>Канал / источник</th><th style="text-align:right">Сессии</th><th style="text-align:right">Пользователи</th><th style="text-align:right" title="Успешно завершённые регистрации (подтверждено появлением экрана «Регистрация завершена»), а не просто клик по кнопке.">Успешных регистраций ⓘ</th><th style="text-align:right">Конверсия</th><th style="text-align:right">Отказы</th><th style="text-align:right">Энгейджмент</th></tr>`;
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  const sortedChannels = (channels||[]).slice().sort((a,b) => b.sessions - a.sessions);
  sortedChannels.forEach(ch => {
    const members = (sources||[]).filter(s => s.channel === ch.name).sort((a,b) => b.sessions - a.sessions);
    // channel header row's rate columns are session-weighted aggregates of its member sources
    const chSignUps = members.reduce((s,m) => s + (m.signUps||0), 0);
    const bounceWeighted = members.reduce((s,m) => s + (m.sessions||0) * (m.bounceRate||0), 0);
    const engagedWeighted = members.reduce((s,m) => s + (m.sessions||0) * (m.engagementRate||0), 0);
    const memberSessions = members.reduce((s,m) => s + (m.sessions||0), 0) || 1;

    const trh = document.createElement("tr"); trh.className = "group-row";
    const tdName = document.createElement("td"); tdName.className = "name-cell"; tdName.textContent = channelLabel(ch.name);
    const tdS = document.createElement("td"); tdS.className = "num"; tdS.textContent = fmtInt(ch.sessions);
    const tdU = document.createElement("td"); tdU.className = "num"; tdU.textContent = fmtInt(ch.totalUsers);
    const tdReg = document.createElement("td"); tdReg.className = "num"; tdReg.textContent = chSignUps ? fmtInt(chSignUps) : "—";
    const tdConv = document.createElement("td"); tdConv.className = "num"; tdConv.textContent = ch.sessions ? fmtPct(chSignUps / ch.sessions * 100) : "—";
    const tdBounce = document.createElement("td"); tdBounce.className = "num"; tdBounce.textContent = members.length ? fmtPct(bounceWeighted / memberSessions) : "—";
    const tdEng = document.createElement("td"); tdEng.className = "num"; tdEng.textContent = members.length ? fmtPct(engagedWeighted / memberSessions) : "—";
    trh.append(tdName, tdS, tdU, tdReg, tdConv, tdBounce, tdEng);
    if (CHANNEL_TIPS[ch.name]) bindTip(trh, channelLabel(ch.name), CHANNEL_TIPS[ch.name]);
    tbody.appendChild(trh);
    const VISIBLE = 6;
    const makeRow = (m, hidden) => {
      const tr = document.createElement("tr"); tr.className = "sub-row";
      if (hidden) tr.style.display = "none";
      const td1 = document.createElement("td"); td1.className = "name-cell"; td1.textContent = m.name;
      const td2 = document.createElement("td"); td2.className = "num"; td2.textContent = fmtInt(m.sessions);
      const td3 = document.createElement("td"); td3.className = "num"; td3.textContent = fmtInt(m.totalUsers);
      const td4 = document.createElement("td"); td4.className = "num"; td4.textContent = m.signUps ? fmtInt(m.signUps) : "—";
      const td5 = document.createElement("td"); td5.className = "num"; td5.textContent = m.sessions ? fmtPct((m.signUps||0) / m.sessions * 100) : "—";
      const td6 = document.createElement("td"); td6.className = "num"; td6.textContent = m.bounceRate != null ? fmtPct(m.bounceRate) : "—";
      const td7 = document.createElement("td"); td7.className = "num"; td7.textContent = m.engagementRate != null ? fmtPct(m.engagementRate) : "—";
      tr.append(td1, td2, td3, td4, td5, td6, td7);
      return tr;
    };
    members.slice(0, VISIBLE).forEach(m => tbody.appendChild(makeRow(m, false)));
    const rest = members.slice(VISIBLE);
    if (rest.length) {
      const hiddenRows = rest.map(m => makeRow(m, true));
      hiddenRows.forEach(r => tbody.appendChild(r));
      const toggleTr = document.createElement("tr"); toggleTr.className = "sub-row";
      const toggleTd = document.createElement("td"); toggleTd.className = "name-cell"; toggleTd.colSpan = 7;
      const toggleBtn = document.createElement("span");
      toggleBtn.style.color = "var(--series-1)"; toggleBtn.style.cursor = "pointer"; toggleBtn.style.textDecoration = "underline dotted";
      toggleBtn.textContent = `Показать ещё ${rest.length} источников`;
      toggleBtn.addEventListener("click", () => {
        const opening = hiddenRows[0].style.display === "none";
        hiddenRows.forEach(r => r.style.display = opening ? "" : "none");
        toggleBtn.textContent = opening ? "Скрыть" : `Показать ещё ${rest.length} источников`;
      });
      toggleTd.appendChild(toggleBtn); toggleTr.appendChild(toggleTd);
      tbody.appendChild(toggleTr);
    }
  });
  table.appendChild(tbody);
  return table;
}

// Countries with the same "is this actually worth it" signal the sources
// table has -- sessions alone can't tell you whether a country converts.
function buildCountryTable(countries) {
  const table = document.createElement("table"); table.className = "data-table";
  const thead = document.createElement("thead");
  thead.innerHTML = `<tr>
    <th>Страна</th>
    <th style="text-align:right">Сессии</th>
    <th style="text-align:right">Пользователи</th>
    <th style="text-align:right">Отказы</th>
    <th style="text-align:right">Вовлечённость</th>
    <th style="text-align:right" title="Успешно завершённые регистрации (подтверждено появлением экрана «Регистрация завершена»), а не просто клик по кнопке.">Успешных регистраций ⓘ</th>
    <th style="text-align:right">Конверсия</th>
  </tr>`;
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  const sorted = (countries || []).slice().sort((a,b) => b.sessions - a.sessions);

  const makeRow = (c, hidden) => {
    const tr = document.createElement("tr");
    if (hidden) tr.style.display = "none";
    const cells = [
      c.name,
      fmtInt(c.sessions),
      fmtInt(c.totalUsers),
      c.bounceRate != null ? fmtPct(c.bounceRate) : "—",
      c.engagementRate != null ? fmtPct(c.engagementRate) : "—",
      c.signUps ? fmtInt(c.signUps) : "—",
      c.sessions && c.signUps ? fmtPct(c.signUps / c.sessions * 100) : "—",
    ];
    cells.forEach((val, i) => {
      const td = document.createElement("td");
      td.className = i === 0 ? "name-cell" : "num";
      td.textContent = val;
      tr.appendChild(td);
    });
    return tr;
  };
  const VISIBLE = 10;
  sorted.slice(0, VISIBLE).forEach(c => tbody.appendChild(makeRow(c, false)));
  const rest = sorted.slice(VISIBLE);
  if (rest.length) {
    const hiddenRows = rest.map(c => makeRow(c, true));
    hiddenRows.forEach(r => tbody.appendChild(r));
    const toggleTr = document.createElement("tr");
    const toggleTd = document.createElement("td"); toggleTd.className = "name-cell"; toggleTd.colSpan = 7;
    const toggleBtn = document.createElement("span");
    toggleBtn.style.color = "var(--series-1)"; toggleBtn.style.cursor = "pointer"; toggleBtn.style.textDecoration = "underline dotted";
    toggleBtn.textContent = `Показать ещё ${rest.length} стран`;
    toggleBtn.addEventListener("click", () => {
      const opening = hiddenRows[0].style.display === "none";
      hiddenRows.forEach(r => r.style.display = opening ? "" : "none");
      toggleBtn.textContent = opening ? "Скрыть" : `Показать ещё ${rest.length} стран`;
    });
    toggleTd.appendChild(toggleBtn); toggleTr.appendChild(toggleTd);
    tbody.appendChild(toggleTr);
  }

  // totals row -- computed over ALL countries (not just the visible top 10),
  // pinned at the end so it reads as a summary, not just another country;
  // distinct styling (bold, tinted background, neutral ink) so it doesn't
  // blend into the blue-link-colored country names above it.
  if (sorted.length) {
    const totalSessions = sorted.reduce((s,c) => s + (c.sessions||0), 0);
    const totalUsers = sorted.reduce((s,c) => s + (c.totalUsers||0), 0);
    const totalSignUps = sorted.reduce((s,c) => s + (c.signUps||0), 0);
    const totalBounceW = sorted.reduce((s,c) => s + (c.sessions||0) * (c.bounceRate||0), 0);
    const totalEngW = sorted.reduce((s,c) => s + (c.sessions||0) * (c.engagementRate||0), 0);
    const totalTr = document.createElement("tr");
    totalTr.style.cssText = "font-weight:600;border-top:2px solid var(--grid);background:color-mix(in srgb, var(--brand-a) 5%, transparent);";
    const totalCells = [
      "Итого",
      fmtInt(totalSessions),
      fmtInt(totalUsers),
      totalSessions ? fmtPct(totalBounceW / totalSessions) : "—",
      totalSessions ? fmtPct(totalEngW / totalSessions) : "—",
      totalSignUps ? fmtInt(totalSignUps) : "—",
      totalSessions && totalSignUps ? fmtPct(totalSignUps / totalSessions * 100) : "—",
    ];
    totalCells.forEach((val, i) => {
      const td = document.createElement("td");
      td.className = i === 0 ? "name-cell" : "num";
      if (i === 0) td.style.color = "var(--text-primary)";
      td.textContent = val;
      totalTr.appendChild(td);
    });
    tbody.appendChild(totalTr);
  }

  table.appendChild(tbody);
  return table;
}

// Clears and rebuilds the "Новые и вернувшиеся" card content -- called from
// renderDynamic so it reacts to the period/filter selection instead of
// always showing the full-period split.
function buildNvrCardContent(container, nvr, periodSessionRows) {
  container.innerHTML = "";
  const nvrTotal = Math.max((nvr?.new || 0) + (nvr?.returning || 0) + (nvr?.unclassified || 0), 1);
  const stat = document.createElement("div"); stat.className = "split-stat";
  const mk = (label, val, tip) => {
    const item = document.createElement("div"); item.className = "split-stat-item"; item.tabIndex = 0;
    const n = document.createElement("div"); n.className = "n"; n.textContent = fmtInt(val) + " (" + Math.round(val/nvrTotal*100) + "%)";
    const l = document.createElement("div"); l.className = "l"; l.textContent = label;
    item.append(n, l);
    bindTip(item, label, tip);
    return item;
  };
  stat.appendChild(mk("Новые посетители", nvr?.new || 0, "Люди, для которых это первый зафиксированный визит на сайт."));
  stat.appendChild(mk("Вернувшиеся посетители", nvr?.returning || 0, "Люди, которые уже были на сайте раньше и пришли снова."));
  if (nvr?.unclassified) {
    stat.appendChild(mk("Пока не классифицировано", nvr.unclassified, "GA4 ещё не определил, новый это посетитель или вернувшийся, обычно из-за небольшого объёма данных в первые дни после запуска. Это НЕ значит 0 вернувшихся."));
  }
  container.appendChild(stat);
  const bar = document.createElement("div"); bar.className = "split-bar";
  const seg = (val, color) => { const s = document.createElement("div"); s.style.width = (val/nvrTotal*100) + "%"; s.style.background = color; return s; };
  bar.appendChild(seg(nvr?.new || 0, cssVar("--series-1")));
  bar.appendChild(seg(nvr?.returning || 0, cssVar("--series-3")));
  bar.appendChild(seg(nvr?.unclassified || 0, cssVar("--grid")));
  container.appendChild(bar);

  // Comparison table -- the split% alone doesn't say anything actionable.
  // This answers the actual question: do new or returning visitors behave
  // differently, and which segment actually converts to registration?
  if (nvr?.detail) {
    const cmpTitle = document.createElement("div");
    cmpTitle.style.cssText = "font-size:12px;color:var(--text-secondary);margin:18px 0 8px;font-weight:600;";
    cmpTitle.textContent = "Сравнение по качеству и конверсии";
    container.appendChild(cmpTitle);
    const cmpTable = document.createElement("table"); cmpTable.className = "data-table";
    const cmpThead = document.createElement("thead");
    cmpThead.innerHTML = `<tr>
      <th>Сегмент</th>
      <th style="text-align:right">Сессии</th>
      <th style="text-align:right">Польз.</th>
      <th style="text-align:right">Отказы</th>
      <th style="text-align:right">Вовлечённость</th>
      <th style="text-align:right">Ср. время</th>
      <th style="text-align:right" title="Сколько сессий этого сегмента дошли хотя бы до начала заполнения формы регистрации.">Начали рег. ⓘ</th>
      <th style="text-align:right" title="Успешно завершённые регистрации (подтверждено появлением экрана «Регистрация завершена»).">Регистраций ⓘ</th>
      <th style="text-align:right">Конверсия</th>
    </tr>`;
    cmpTable.appendChild(cmpThead);
    const cmpTbody = document.createElement("tbody");
    const segments = [["new", "Новые"], ["returning", "Вернувшиеся"]];
    if (nvr.detail.unclassified?.sessions) segments.push(["unclassified", "Не классифицировано"]);
    segments.forEach(([key, label]) => {
      const d = nvr.detail[key] || {};
      const tr = document.createElement("tr");
      const cells = [
        label,
        fmtInt(d.sessions || 0),
        d.totalUsers ? fmtInt(d.totalUsers) : "—",
        d.sessions ? fmtPct(d.bounceRate) : "—",
        d.sessions ? fmtPct(d.engagementRate) : "—",
        d.avgSessionSec ? fmtDur(d.avgSessionSec) : "—",
        d.regStarts ? fmtInt(d.regStarts) : "—",
        d.signUps ? fmtInt(d.signUps) : "—",
        d.sessions && d.signUps ? fmtPct(d.signUpRate) : "—",
      ];
      cells.forEach((c, i) => {
        const td = document.createElement("td");
        td.className = i === 0 ? "name-cell" : "num";
        td.textContent = c;
        tr.appendChild(td);
      });
      cmpTbody.appendChild(tr);
    });
    cmpTable.appendChild(cmpTbody);
    container.appendChild(cmpTable);
  }

  // daily breakdown -- a single aggregate split hides whether the new/
  // returning mix is stable or shifting (e.g. a campaign that only brings
  // one-time visitors, or a loyalty dip after a bad release).
  if (periodSessionRows && periodSessionRows.length) {
    const byDate = new Map();
    periodSessionRows.forEach(r => {
      if (!byDate.has(r.date)) byDate.set(r.date, { new: 0, returning: 0, unclassified: 0 });
      const bucket = byDate.get(r.date);
      if (r.nvr === "new") bucket.new += r.sessions;
      else if (r.nvr === "returning") bucket.returning += r.sessions;
      else bucket.unclassified += r.sessions;
    });
    const days = Array.from(byDate.keys()).sort();
    if (days.length > 1) {
      const trendTitle = document.createElement("div");
      trendTitle.style.cssText = "font-size:12px;color:var(--text-secondary);margin:18px 0 8px;font-weight:600;";
      trendTitle.textContent = "Динамика по дням — доля новых/вернувшихся";
      container.appendChild(trendTitle);
      const dayMax = Math.max(...days.map(d => { const b = byDate.get(d); return b.new + b.returning + b.unclassified; }), 1);
      const chartRow = document.createElement("div");
      chartRow.style.cssText = "display:flex;align-items:flex-end;gap:4px;height:90px;";
      days.forEach(d => {
        const b = byDate.get(d);
        const total = b.new + b.returning + b.unclassified;
        const outer = document.createElement("div");
        outer.style.cssText = "flex:1;display:flex;flex-direction:column;align-items:stretch;height:90px;justify-content:flex-end;";
        const colWrap = document.createElement("div");
        colWrap.tabIndex = 0;
        colWrap.style.cssText = `display:flex;flex-direction:column-reverse;height:${Math.max(total/dayMax*100,3)}%;border-radius:3px;overflow:hidden;cursor:pointer;`;
        const segNew = document.createElement("div"); segNew.style.cssText = `background:${cssVar("--series-1")};height:${total?b.new/total*100:0}%;min-height:${b.new?1:0}px;`;
        const segRet = document.createElement("div"); segRet.style.cssText = `background:${cssVar("--series-3")};height:${total?b.returning/total*100:0}%;min-height:${b.returning?1:0}px;`;
        const segUn = document.createElement("div"); segUn.style.cssText = `background:${cssVar("--grid")};height:${total?b.unclassified/total*100:0}%;min-height:${b.unclassified?1:0}px;`;
        colWrap.append(segNew, segRet, segUn);
        const pctNew = total ? Math.round(b.new/total*100) : 0;
        bindTip(colWrap, d, `${d}: новых ${fmtInt(b.new)} (${pctNew}%), вернувшихся ${fmtInt(b.returning)}${b.unclassified ? ", не классифицировано " + fmtInt(b.unclassified) : ""} — всего ${fmtInt(total)} сессий`);
        outer.appendChild(colWrap);
        chartRow.appendChild(outer);
      });
      container.appendChild(chartRow);
    }
  }
}

function kpiTile(label, rawValue, tipKey, opts) {
  opts = opts || {};
  const tile = document.createElement("div"); tile.className = "kpi-tile reveal"; tile.tabIndex = 0;
  tile.style.setProperty("--kpi-accent", cssVar(KPI_ACCENTS[tipKey] || "--brand-a"));
  const top = document.createElement("div"); top.className = "kpi-tile-top";
  const lab = document.createElement("div"); lab.className = "kpi-label";
  const labText = document.createElement("span"); labText.textContent = label;
  const dot = document.createElement("span"); dot.className = "info-dot"; dot.textContent = "i";
  lab.append(labText, dot);
  const icon = document.createElement("div"); icon.className = "kpi-icon";
  icon.innerHTML = `<svg viewBox="0 0 24 24">${KPI_ICONS[tipKey] || ""}</svg>`;
  top.append(lab, icon);
  const val = document.createElement("div"); val.className = "kpi-value" + (opts.dim ? " dim" : "");
  tile.append(top, val);
  if (opts.dim || rawValue == null) {
    val.textContent = opts.staticText || String(rawValue);
  } else {
    val.textContent = "0";
    animateCount(val, rawValue, { format: opts.format || fmtInt });
  }
  if (opts.sub) {
    const sub = document.createElement("div"); sub.className = "kpi-sub"; sub.textContent = opts.sub;
    tile.appendChild(sub);
  }
  if (KPI_TIPS[tipKey]) bindTip(tile, label, KPI_TIPS[tipKey]);
  return tile;
}

/* ===================== filters (client-side, zero extra API calls) ===================== */
// Every filter just sums matching rows out of the flat tables the Python
// script already fetched — recompute is instant, no network round-trip.
// periodDateRange() (defined below, reads the global PERIOD_STATE from the
// calendar picker) is applied HERE, at the single source every KPI/trend/
// event number is derived from -- an earlier version tried to pre-filter
// p.totals externally instead, but renderTab's own hasFlat path recomputes
// totals straight from these raw rows and silently ignored that override,
// so the period picker never actually changed anything it displayed.
function inPeriodRange(dateStr) {
  const range = typeof periodDateRange === "function" ? periodDateRange() : null;
  return !range || (dateStr >= range.start && dateStr <= range.end);
}
function filterSessionRows(rows, f) {
  return (rows || []).filter(r =>
    inPeriodRange(r.date) &&
    (f.country === "all" || r.country === f.country) &&
    (f.channel === "all" || r.channel === f.channel) &&
    (f.os === "all" || r.os === f.os)
  );
}
function filterEventRows(rows, f, nvrMode) {
  return (rows || []).filter(r =>
    inPeriodRange(r.date) &&
    (f.country === "all" || r.country === f.country) &&
    (f.channel === "all" || r.channel === f.channel) &&
    (f.os === "all" || r.os === f.os) &&
    (!nvrMode || nvrMode === "all" || r.nvr === nvrMode)
  );
}
function computeFilteredTotals(sessionRows) {
  let sessions=0, totalUsers=0, screenPageViews=0, bounceSessions=0, engagedSessions=0, engagementDurationSec=0;
  sessionRows.forEach(r => {
    sessions += r.sessions; totalUsers += r.totalUsers; screenPageViews += r.screenPageViews;
    bounceSessions += r.bounceSessions; engagedSessions += r.engagedSessions; engagementDurationSec += r.engagementDurationSec || 0;
  });
  return {
    sessions, totalUsers, screenPageViews,
    bounceRate: sessions > 0 ? bounceSessions / sessions * 100 : 0,
    engagementRate: sessions > 0 ? engagedSessions / sessions * 100 : 0,
    // Divided by ALL sessions (incl. ~70-77% bounces with ~0 engaged time on
    // this site), this collapsed to a misleading "18 seconds" -- GA4's own
    // "average session duration" metric is 5-10x higher, but it isn't a
    // summable raw metric (can't be correctly re-derived per an arbitrary
    // client-side period/country/etc. filter the way engagementDurationSec
    // can). Dividing by ENGAGED sessions instead uses only data already in
    // the flat rows, stays fully period-reactive, and answers the question
    // that's actually useful: how long do people who didn't bounce stay.
    averageSessionDuration: engagedSessions > 0 ? engagementDurationSec / engagedSessions : 0,
  };
}
function computeFilteredEvents(eventRows) {

// Client-side breakdowns for the sections that CAN be made period-reactive
// from the existing flat tables (country/os/newVsReturning are all captured

// so the same downstream table/donut/card-building functions work whether

function computeCountryBreakdown(sessionRows, eventRows) {
  const map = new Map();
  (sessionRows || []).forEach(r => {

  });

}
function filterLandingRows(rows) {

  return (rows || []).filter(r => inPeriodRange(r.date));
}
function computeSourceBreakdown(sourceRows) {
  const map = new Map();
  (sourceRows || []).forEach(r => {
    const key = r.channel + "||" + r.source;
    if (!map.has(key)) map.set(key, { channel: r.channel, name: r.source, sessions: 0, totalUsers: 0, signUps: 0, _bounceSessions: 0, _engagedSessions: 0 });
    const acc = map.get(key);

    acc.signUps += r.signUps || 0;

    channel: acc.channel, name: acc.name, sessions: acc.sessions, totalUsers: acc.totalUsers, signUps: acc.signUps,
    bounceRate: acc.sessions ? acc._bounceSessions / acc.sessions * 100 : 0,
    engagementRate: acc.sessions ? acc._engagedSessions / acc.sessions * 100 : 0,

}
function computeChannelBreakdown(sourcesArr) {
  const map = new Map();
  (sourcesArr || []).forEach(s => {
    if (!map.has(s.channel)) map.set(s.channel, { name: s.channel, sessions: 0, totalUsers: 0 });
    const acc = map.get(s.channel);

function computeLandingBreakdown(landingRows) {
  const map = new Map();
  (landingRows || []).forEach(r => {
    if (!map.has(r.name)) map.set(r.name, { name: r.name, sessions: 0, totalUsers: 0, screenPageViews: 0, regStarts: 0, signUps: 0, _bounceSessions: 0, _engagedSessions: 0, _durSum: 0 });
    const acc = map.get(r.name);
    acc.sessions += r.sessions; acc.totalUsers += r.totalUsers; acc.screenPageViews += r.screenPageViews;
    acc._bounceSessions += r.bounceSessions || 0; acc._engagedSessions += r.engagedSessions || 0;
    acc._durSum += r.engagementDurationSec || 0;
    acc.regStarts += r.regStarts || 0; acc.signUps += r.signUps || 0;

    name: acc.name, sessions: acc.sessions, totalUsers: acc.totalUsers, screenPageViews: acc.screenPageViews,
    regStarts: acc.regStarts, signUps: acc.signUps,
    bounceRate: acc.sessions ? acc._bounceSessions / acc.sessions * 100 : 0,
    engagementRate: acc.sessions ? acc._engagedSessions / acc.sessions * 100 : 0,
