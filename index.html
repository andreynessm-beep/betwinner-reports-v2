function computeNvrFromRows(sessionRows, eventRows) {
  const mk = () => ({ sessions: 0, totalUsers: 0, bounceSessions: 0, engagedSessions: 0, durSum: 0, regStarts: 0, signUps: 0 });
  const acc = { new: mk(), returning: mk(), unclassified: mk() };
  const bucketOf = nvr => nvr === "new" ? "new" : nvr === "returning" ? "returning" : "unclassified";
  (sessionRows || []).forEach(r => {
    const a = acc[bucketOf(r.nvr)];
    a.sessions += r.sessions; a.totalUsers += r.totalUsers;
    a.bounceSessions += r.bounceSessions || 0; a.engagedSessions += r.engagedSessions || 0;
    a.durSum += r.engagementDurationSec || 0;
  });
  (eventRows || []).forEach(r => {
    const a = acc[bucketOf(r.nvr)];
    if (r.event === "reg_form_start") a.regStarts += r.count;
    if (r.event === "sign_up_success") a.signUps += r.count;
  });
  const out = { new: 0, returning: 0, unclassified: 0, detail: {} };
  ["new", "returning", "unclassified"].forEach(key => {
    const a = acc[key];
    out[key] = a.sessions;
    out.detail[key] = {
      sessions: a.sessions, totalUsers: a.totalUsers,
      bounceRate: a.sessions ? a.bounceSessions / a.sessions * 100 : 0,
      engagementRate: a.sessions ? a.engagedSessions / a.sessions * 100 : 0,
      avgSessionSec: a.sessions ? a.durSum / a.sessions : 0,
      regStarts: a.regStarts, signUps: a.signUps,
      signUpRate: a.sessions ? round2(a.signUps / a.sessions * 100) : 0,
    };
  });
  return out;
}

/* ===================== calendar period picker (неделя/месяц/квартал) ===================== */
const MONTH_NAMES = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function addDaysISO(dateStr, n) {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function mondayOfISO(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const day = (d.getUTCDay() + 6) % 7; // 0=Mon..6=Sun
  return addDaysISO(dateStr, -day);
}
function fmtDM(dateStr) {
  const [, m, d] = dateStr.split("-");
  return `${d}.${m}`;
}
function monthKey(dateStr) { return dateStr.slice(0, 7); } // "YYYY-MM"
function quarterOf(dateStr) {
  const [y, m] = dateStr.slice(0, 7).split("-").map(Number);
  return { year: y, q: Math.ceil(m / 3) };
}
function lastDayOfMonth(year, month) { // month: 1-12
  return new Date(Date.UTC(year, month, 0)).getUTCDate();
}
// Monday-aligned week chunks clipped to the month's own boundaries (so the
// first/last chunk can be shorter than 7 days, matching how a real calendar
// week overlaps a month edge).
function weeksInMonth(year, month) {
  const mm = String(month).padStart(2, "0");
  const monthStart = `${year}-${mm}-01`;
  const monthEnd = `${year}-${mm}-${String(lastDayOfMonth(year, month)).padStart(2, "0")}`;
  const weeks = [];
  let cur = mondayOfISO(monthStart);
  while (cur <= monthEnd) {
    const weekEnd = addDaysISO(cur, 6);
    weeks.push({ start: cur < monthStart ? monthStart : cur, end: weekEnd > monthEnd ? monthEnd : weekEnd });
    cur = addDaysISO(cur, 7);
  }
  return weeks;
}
function monthsInQuarter(year, q) {
  const first = (q - 1) * 3 + 1;
  return [first, first + 1, first + 2];
}

// mode: "all" | "quarter" | "month" | "week" -- separate from quarter/month/
// week, which just remember the last-chosen context so switching modes
// doesn't lose your place. Keeping "all" as its own mode (rather than
// quarter===null) avoids the picker silently re-selecting the current
// quarter the next time it rebuilds and it re-populates quarter from data.
let PERIOD_STATE = { mode: "all", quarter: null, month: null, week: null, day: null };

function periodDateRange() {
  if (PERIOD_STATE.mode === "all" || !PERIOD_STATE.quarter) return null;
  if (PERIOD_STATE.mode === "day" && PERIOD_STATE.day) return { start: PERIOD_STATE.day, end: PERIOD_STATE.day };
  if (PERIOD_STATE.mode === "week" && PERIOD_STATE.week) return PERIOD_STATE.week;
  if (PERIOD_STATE.mode === "month" && PERIOD_STATE.month) {
    const mm = String(PERIOD_STATE.month).padStart(2, "0");
    const y = PERIOD_STATE.quarter.year;
    return { start: `${y}-${mm}-01`, end: `${y}-${mm}-${String(lastDayOfMonth(y, PERIOD_STATE.month)).padStart(2,"0")}` };
  }
  const [m1, , m3] = monthsInQuarter(PERIOD_STATE.quarter.year, PERIOD_STATE.quarter.q);
  const y = PERIOD_STATE.quarter.year;
  return { start: `${y}-${String(m1).padStart(2,"0")}-01`, end: `${y}-${String(m3).padStart(2,"0")}-${String(lastDayOfMonth(y, m3)).padStart(2,"0")}` };
}

function buildPeriodPicker(availableDates) {
  const monthsRow = document.getElementById("period-row-months");
  const weeksRow = document.getElementById("period-row-weeks");
  if (!availableDates.length) { monthsRow.innerHTML = ""; weeksRow.style.display = "none"; return; }
  const maxDate = availableDates[availableDates.length - 1];
  if (!PERIOD_STATE.quarter) PERIOD_STATE.quarter = quarterOf(maxDate);

  const monthsWithData = monthsInQuarter(PERIOD_STATE.quarter.year, PERIOD_STATE.quarter.q)
    .filter(m => {
      const mm = String(m).padStart(2, "0");
      return availableDates.some(d => d.startsWith(`${PERIOD_STATE.quarter.year}-${mm}`));
    });

  monthsRow.innerHTML = "";
  const pill = (label, active, onClick, disabled) => {
    const b = document.createElement("button"); b.type = "button"; b.className = "period-pill" + (active ? " active" : "");
    b.textContent = label; b.disabled = !!disabled;
    if (!disabled) b.addEventListener("click", onClick);
    return b;
  };
  monthsRow.appendChild(pill("Весь период", PERIOD_STATE.mode === "all", () => { PERIOD_STATE.mode = "all"; onPeriodChange(); }));
  monthsWithData.forEach(m => {
    monthsRow.appendChild(pill(MONTH_NAMES[m - 1], PERIOD_STATE.mode === "month" && PERIOD_STATE.month === m, () => { PERIOD_STATE.mode = "month"; PERIOD_STATE.month = m; onPeriodChange(); }));
  });

  const daysRow = document.getElementById("period-row-days");
  if (PERIOD_STATE.mode === "month" || PERIOD_STATE.mode === "week" || PERIOD_STATE.mode === "day") {
    weeksRow.style.display = "";
    weeksRow.innerHTML = "";
    weeksRow.appendChild(pill("Весь месяц", PERIOD_STATE.mode === "month", () => { PERIOD_STATE.mode = "month"; onPeriodChange(); }));
    weeksInMonth(PERIOD_STATE.quarter.year, PERIOD_STATE.month).forEach(w => {
      const hasData = availableDates.some(d => d >= w.start && d <= w.end);
      const active = PERIOD_STATE.mode === "week" && PERIOD_STATE.week && PERIOD_STATE.week.start === w.start && PERIOD_STATE.week.end === w.end;
      weeksRow.appendChild(pill(`${fmtDM(w.start)}–${fmtDM(w.end)}`, active, () => { PERIOD_STATE.mode = "week"; PERIOD_STATE.week = w; onPeriodChange(); }, !hasData));
    });

    // day-of-month pills -- every calendar day, disabled if no data that day
    daysRow.style.display = "";
    daysRow.innerHTML = "";
    const mm = String(PERIOD_STATE.month).padStart(2, "0");
    const y = PERIOD_STATE.quarter.year;
    const numDays = lastDayOfMonth(y, PERIOD_STATE.month);
    for (let d = 1; d <= numDays; d++) {
      const dateStr = `${y}-${mm}-${String(d).padStart(2, "0")}`;
      const hasData = availableDates.includes(dateStr);
      const active = PERIOD_STATE.mode === "day" && PERIOD_STATE.day === dateStr;
      daysRow.appendChild(pill(String(d), active, () => { PERIOD_STATE.mode = "day"; PERIOD_STATE.day = dateStr; onPeriodChange(); }, !hasData));
    }
  } else {
    weeksRow.style.display = "none";
    daysRow.style.display = "none";
  }
}

const OS_LABELS = { "Windows": "Windows", "Macintosh": "macOS", "iOS": "iOS", "Android": "Android", "Linux": "Linux", "Chrome OS": "Chrome OS", "Tizen": "Tizen" };
function osLabel(name) { return OS_LABELS[name] || name; }

function uniqueSorted(rows, field, labelFn) {
  const totals = new Map();
  rows.forEach(r => totals.set(r[field], (totals.get(r[field]) || 0) + r.sessions));
  return Array.from(totals.entries())
    .sort((a,b) => b[1] - a[1])
    .map(([value]) => ({ value, label: labelFn ? labelFn(value) : value }));
}

function buildFilterBar(sessionRows, onChange) {

    { key: "country", label: "Все страны", options: uniqueSorted(sessionRows, "country") },

  ];

  clearBtn.textContent = "Сбросить фильтры";

  fields.forEach(f => {

      clearBtn.classList.toggle("show", Object.values(filters).some(v => v !== "all"));
      onChange(filters);
    });
    field.appendChild(select);
    bar.appendChild(field);
  });

  clearBtn.addEventListener("click", () => {
    filters.country = "all"; filters.channel = "all"; filters.os = "all";

    bar.querySelectorAll(".filter-field").forEach(f => f.classList.remove("active"));
    clearBtn.classList.remove("show");
    onChange(filters);

/* ===================== render one tab ===================== */
function renderTab(containerId, p, deviceLabel) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  const { totals, events, avg_load_time_ms: avgLoadTimeMs, trend, channels, sources, countries, browsers, operating_systems: oses, landing_pages: landingPages, new_vs_returning: nvr, signup_success_by_source: successBySource, event_details: eventDetails, filter_session_rows: sessionRows, filter_event_rows: eventRows, filter_source_rows: sourceRows, filter_landing_rows: landingRows } = p;
  const hasFlat = sessionRows && sessionRows.length && eventRows;

  const kpiZone = document.createElement("div");
  const belowFilterZone = document.createElement("div");
  let funnelMode = "all"; // funnel-only toggle: "all" visitors vs "new" visitors

  // Persistent content containers for the sections that react to the
  // period/filter selection, sourced from the flat tables (country/os/nvr/
  // event counts from filter_session_rows+filter_event_rows; channel+source
  // from filter_source_rows; landing page from filter_landing_rows -- two
  // separate lean tables, not piled onto the 5-dim session table, to avoid
  // a combinatorial blowup in row count/file size). Created once,
  // repopulated by renderDynamic on every call -- by the time they're
  // appended into the page further down, the initial
  // renderDynamic(initialFilters) call below has already filled them once.
  // Браузеры stays static/full-period -- that one dimension genuinely isn't
  // captured anywhere in the flat tables.
  const geoCard = document.createElement("div"); geoCard.className = "card";
  const osCard = document.createElement("div");
  const evCard = document.createElement("div"); evCard.className = "card";
  const nvrCard = document.createElement("div"); nvrCard.className = "card";
  const srcCard = document.createElement("div"); srcCard.className = "card";
  const lpCard = document.createElement("div"); lpCard.className = "card";

  function renderDynamic(filters) {
    const fSessionRows = hasFlat ? filterSessionRows(sessionRows, filters) : null;
    const fTotals = hasFlat ? computeFilteredTotals(fSessionRows) : totals;
    // KPI tiles above the funnel always reflect ALL visitors -- only the funnel
    // diagram itself reacts to the "Все посетители"/"Только новые" toggle.
    const fEventRowsAll = hasFlat ? filterEventRows(eventRows, filters, "all") : [];
    const fEventsAll = hasFlat ? computeFilteredEvents(fEventRowsAll) : events;
    const fEventsFunnel = hasFlat ? computeFilteredEvents(filterEventRows(eventRows, filters, funnelMode)) : events;
    const fTrend = hasFlat ? computeFilteredTrend(fSessionRows) : trend;
    const fRegTrend = hasFlat ? computeFilteredEventTrend(fEventRowsAll, "sign_up_success") : [];

    // Funnel + conversion rates are USER-based, not session-based: a person
    // can visit several times before registering (or while filling the form
    // more than once), which would otherwise dilute the "visit -> register"
    // rate against a denominator inflated by repeat browsing. Registration
    // itself is a person-level action, so its funnel should be measured
    // against distinct people, not visits. The top traffic KPIs (Сессии /
    // Пользователи / bounce / engagement / duration) stay session-based --
    // those ARE inherently per-visit concepts and don't make sense per-user.
    const stepsFrom = fEvents => [
      { name: "__visit", label: "Посетители сайта", value: fTotals.totalUsers, desc: "Все уникальные пользователи за период (с учётом фильтров)." },
      ...["reg_form_start", "sign_up_success"].map(name => ({
        name, label: GLOSSARY[name].label, value: (fEvents[name] && fEvents[name].users) || 0, desc: GLOSSARY[name].desc,
      })),
    ];
    // Only 3 real funnel steps -- a separate "arrived at registration page"
    // step (reg_page_view, GA4's own pageview signal) turned out unreliable
    // as a uniform cross-platform signal: on mobile the registration form can
    // open as an in-page overlay without the URL/pagePath ever changing, so
    // pageview filtering silently misses most mobile attempts (verified:
    // mobile reg_page_view came in far BELOW reg_form_start, which is
    // impossible if it were truly a superset step). reg_form_start is the one
    // signal proven reliable on both platforms (fires on the form fields
    // actually appearing, regardless of routing/modal mechanics), so it's the
    // funnel's real step 1.
    const kpiSteps = stepsFrom(fEventsAll);
    const signupRate = kpiSteps[0].value > 0 ? kpiSteps[1].value / kpiSteps[0].value * 100 : 0;
    const overallConversionRate = fTotals.totalUsers > 0 ? kpiSteps[2].value / fTotals.totalUsers * 100 : 0;

    // ---- THE funnel diagram: the one thing that reacts to the toggle ----
    const funnelSteps = stepsFrom(fEventsFunnel);

    // ---- KPI grid: headline numbers, including the funnel's key conversions
    // (dashboard design: 5-9 max, but conversion is the whole point of the page) ----
    kpiZone.innerHTML = "";
    const kpiGrid = document.createElement("div"); kpiGrid.className = "kpi-grid";
    kpiGrid.appendChild(kpiTile("Сессии", fTotals.sessions, "sessions"));
    kpiGrid.appendChild(kpiTile("Пользователи", fTotals.totalUsers, "totalUsers"));
    kpiGrid.appendChild(kpiTile("Начали заполнять форму", signupRate, "signupRate", { format: v => fmtPct(v), sub: `${fmtInt(kpiSteps[1].value)} человек` }));
    kpiGrid.appendChild(kpiTile("Конверсия сайта: посетитель → регистрация", overallConversionRate, "overallConversionRate", {
      // this is two small percentages multiplied together (6% * 0.4% и т.п.),
      // so it can land well under 0.1% -- fmtPct's fixed 1 decimal would
      // round the site's headline conversion number to a flat, useless "0%"
      format: v => (v < 1 ? v.toFixed(2) : v.toFixed(1)).replace(".", ",") + "%",
      sub: `${fmtInt(kpiSteps[2].value)} из ${fmtInt(fTotals.totalUsers)} посетителей`,
    }));
    kpiGrid.appendChild(kpiTile("Ср. время вовлечённой сессии", fTotals.averageSessionDuration, "averageSessionDuration", { format: fmtDur }));
    kpiGrid.appendChild(kpiTile("Показатель отказов", fTotals.bounceRate, "bounceRate", { format: v => v.toFixed(0) + "%" }));
    kpiGrid.appendChild(kpiTile("Engagement rate", fTotals.engagementRate, "engagementRate", { format: v => v.toFixed(0) + "%" }));
    kpiGrid.appendChild(avgLoadTimeMs && avgLoadTimeMs > 0
      ? kpiTile("Ср. время загрузки", avgLoadTimeMs, "avgLoadTime", { format: v => (v/1000).toFixed(1).replace(".", ",") + " с" })
      : kpiTile("Ср. время загрузки", null, "avgLoadTime", { dim: true, staticText: "собираем данные" }));
    kpiZone.appendChild(kpiGrid);

    belowFilterZone.innerHTML = "";
    if (funnelSteps[0].value > 0) {
      const wrap = document.createElement("div"); wrap.className = "funnel-highlight reveal";
      const t = document.createElement("div"); t.className = "funnel-highlight-title"; t.textContent = "Воронка регистрации";
      const h = document.createElement("div"); h.className = "funnel-highlight-hint"; h.textContent = "посетитель → начали заполнять форму → успешная регистрация";
      wrap.append(t, h);

      if (hasFlat) {
        const toggle = document.createElement("div"); toggle.className = "funnel-toggle";
        const mkBtn = (mode, label, tip) => {
          const b = document.createElement("button"); b.type = "button";
          b.className = "funnel-toggle-btn" + (funnelMode === mode ? " active" : "");
          b.textContent = label;
          bindTip(b, label, tip);
          b.addEventListener("click", () => { if (funnelMode !== mode) { funnelMode = mode; renderDynamic(filters); } });

function mergeBreakdown(a, b, metricKeys) {
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    if (!map.has(row.name)) map.set(row.name, { name: row.name, ...Object.fromEntries(metricKeys.map(k => [k, 0])) });
    const acc = map.get(row.name);
    metricKeys.forEach(k => { acc[k] += row[k] || 0; });
  });
  return Array.from(map.values()).sort((x,y) => y[metricKeys[0]] - x[metricKeys[0]]);
}
function mergeCountries(a, b) {
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    if (!map.has(row.name)) map.set(row.name, { name: row.name, sessions: 0, totalUsers: 0, signUps: 0, _bounceW: 0, _engW: 0 });
    const acc = map.get(row.name);
    acc.sessions += row.sessions; acc.totalUsers += row.totalUsers; acc.signUps += row.signUps || 0;
    acc._bounceW += (row.sessions||0) * (row.bounceRate||0);
    acc._engW += (row.sessions||0) * (row.engagementRate||0);
  });
  return Array.from(map.values()).map(acc => ({
    name: acc.name, sessions: acc.sessions, totalUsers: acc.totalUsers, signUps: acc.signUps,
    signUpRate: acc.sessions ? round2(acc.signUps / acc.sessions * 100) : 0,
    bounceRate: acc.sessions ? acc._bounceW / acc.sessions : 0,
    engagementRate: acc.sessions ? acc._engW / acc.sessions : 0,
  })).sort((x,y) => y.sessions - x.sessions);
}
function round2(n) { return Math.round(n * 100) / 100; }
function mergeBySource(a, b) {
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    map.set(row.source, (map.get(row.source)||0) + row.count);
  });
  return Array.from(map.entries()).map(([source, count]) => ({source, count})).sort((x,y) => y.count - x.count);
}
function mergeNvr(d, m) {
  const out = { new: (d?.new||0) + (m?.new||0), returning: (d?.returning||0) + (m?.returning||0), unclassified: (d?.unclassified||0) + (m?.unclassified||0), detail: {} };
  ["new", "returning", "unclassified"].forEach(key => {
    const dd = d?.detail?.[key] || {}, md = m?.detail?.[key] || {};
    const sessions = (dd.sessions||0) + (md.sessions||0);
    const signUps = (dd.signUps||0) + (md.signUps||0);
    out.detail[key] = {
      sessions,
      totalUsers: (dd.totalUsers||0) + (md.totalUsers||0),
      bounceRate: sessions ? ((dd.bounceRate||0)*(dd.sessions||0) + (md.bounceRate||0)*(md.sessions||0)) / sessions : 0,
      engagementRate: sessions ? ((dd.engagementRate||0)*(dd.sessions||0) + (md.engagementRate||0)*(md.sessions||0)) / sessions : 0,
      avgSessionSec: sessions ? ((dd.avgSessionSec||0)*(dd.sessions||0) + (md.avgSessionSec||0)*(md.sessions||0)) / sessions : 0,
      regStarts: (dd.regStarts||0) + (md.regStarts||0),
      signUps,
      signUpRate: sessions ? round2(signUps / sessions * 100) : 0,
    };
  });
  return out;
}
function mergeSources(a, b) {
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    const key = row.channel + "||" + row.name;
    if (!map.has(key)) map.set(key, { channel: row.channel, name: row.name, sessions: 0, totalUsers: 0, signUps: 0, _bounceW: 0, _engW: 0 });
    const acc = map.get(key);
    acc.sessions += row.sessions; acc.totalUsers += row.totalUsers; acc.signUps += row.signUps || 0;
    acc._bounceW += (row.sessions||0) * (row.bounceRate||0);
    acc._engW += (row.sessions||0) * (row.engagementRate||0);
  });
  return Array.from(map.values()).map(acc => ({
    channel: acc.channel, name: acc.name, sessions: acc.sessions, totalUsers: acc.totalUsers, signUps: acc.signUps,
    bounceRate: acc.sessions ? acc._bounceW / acc.sessions : 0,
    engagementRate: acc.sessions ? acc._engW / acc.sessions : 0,
  })).sort((x,y) => y.sessions - x.sessions);
}
function mergeTrend(a, b) {
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    if (!map.has(row.date)) map.set(row.date, { date: row.date, sessions: 0, totalUsers: 0, screenPageViews: 0 });
    const acc = map.get(row.date);
    acc.sessions += row.sessions; acc.totalUsers += row.totalUsers; acc.screenPageViews += row.screenPageViews;
  });
  return Array.from(map.values()).sort((x,y) => x.date.localeCompare(y.date));
}
function mergeLandingPages(a, b) {
  // bounceRate/engagementRate/avgSessionSec are ratios, not additive -- an
  // earlier version of this merge dropped them entirely (map entries never
  // carried the fields), which silently showed "—" for every row on any
  // combined (desktop+mobile) tab. Session-weight them properly instead, same
  // pattern as mergeCountries/mergeSources.
  const map = new Map();
  [...(a||[]), ...(b||[])].forEach(row => {
    if (!map.has(row.name)) map.set(row.name, { name: row.name, sessions: 0, totalUsers: 0, screenPageViews: 0, regStarts: 0, signUps: 0, _bounceW: 0, _engW: 0, _durW: 0 });
    const acc = map.get(row.name);
    acc.sessions += row.sessions;
    acc.totalUsers += row.totalUsers || 0;
    acc.screenPageViews += row.screenPageViews;
    acc.regStarts += row.regStarts || 0;
    acc.signUps += row.signUps || 0;
    acc._bounceW += (row.sessions||0) * (row.bounceRate||0);
    acc._engW += (row.sessions||0) * (row.engagementRate||0);
    acc._durW += (row.sessions||0) * (row.avgSessionSec||0);
  });
  return Array.from(map.values()).map(acc => ({
    name: acc.name, sessions: acc.sessions, totalUsers: acc.totalUsers, screenPageViews: acc.screenPageViews,
    regStarts: acc.regStarts, signUps: acc.signUps,
    bounceRate: acc.sessions ? acc._bounceW / acc.sessions : 0,
    engagementRate: acc.sessions ? acc._engW / acc.sessions : 0,
    avgSessionSec: acc.sessions ? acc._durW / acc.sessions : 0,
  })).sort((x,y) => y.sessions - x.sessions);
}
function mergeEventDetails(a, b) {
  const out = {};
  [a||{}, b||{}].forEach(obj => {
    Object.entries(obj).forEach(([ev, rows]) => {
      if (!out[ev]) out[ev] = {};
      rows.forEach(r => { out[ev][r.value] = (out[ev][r.value]||0) + r.count; });
    });
  });
  const result = {};
  Object.entries(out).forEach(([ev, valMap]) => {
    result[ev] = Object.entries(valMap).map(([value,count]) => ({value,count})).sort((x,y)=>y.count-x.count);
  });
  return result;
}

    { key: "signUps", label: "Регистраций", align: "right" },
    { key: "conversion", label: "Конверсия", align: "right" },
    { key: "bounceRate", label: "Отказы", align: "right" },
  ];
  // Default: conversion, descending -- same starting view as before this got sortable
  let sortKey = "conversion", sortDir = -1;

  const table = document.createElement("table");
  table.className = "events-table";
  const thead = document.createElement("thead");
  const headRow = document.createElement("tr");
  COLS.forEach(col => {
    const th = document.createElement("th");
    th.style.textAlign = col.align;
    th.style.cursor = "pointer";
    th.style.userSelect = "none";
    th.dataset.key = col.key;
    th.addEventListener("click", () => {
      if (sortKey === col.key) sortDir = -sortDir; else { sortKey = col.key; sortDir = col.key === "name" ? 1 : -1; }
      render();
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  table.appendChild(tbody);
  wrap.appendChild(table);
  panel.prepend(wrap);

  function render() {
    const dirLabel = sortDir === 1 ? "по возрастанию" : "по убыванию";
    const colLabel = COLS.find(c => c.key === sortKey).label.toLowerCase();
    title.textContent = `Сравнение рынков (${domains.length}) — отсортировано по: ${colLabel} (${dirLabel})`;

    headRow.querySelectorAll("th").forEach(th => {
      const isActive = th.dataset.key === sortKey;
      th.innerHTML = COLS.find(c => c.key === th.dataset.key).label + (isActive ? (sortDir === 1 ? " ▲" : " ▼") : "");
    });

    const sorted = [...rows].sort((a, b) => {
      const av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") return sortDir * av.localeCompare(bv);
      return sortDir * (av - bv);
    });

    tbody.innerHTML = "";
    sorted.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td>${r.name}</td><td class="num">${fmtInt(r.sessions)}</td><td class="num">${fmtInt(r.totalUsers)}</td>
        <td class="num">${r.signUps ? fmtInt(r.signUps) : "—"}</td>
        <td class="num" style="font-weight:600;">${r.signUps ? fmtPct(r.conversion) : "—"}</td>
        <td class="num">${fmtPct(r.bounceRate)}</td>`;
      tbody.appendChild(tr);
    });
  }
  render();
}

function combineProps(desktop, mobile) {
  const totals = {
    sessions: desktop.totals.sessions + mobile.totals.sessions,
    totalUsers: desktop.totals.totalUsers + mobile.totals.totalUsers,
    screenPageViews: desktop.totals.screenPageViews + mobile.totals.screenPageViews,
    averageSessionDuration: (desktop.totals.averageSessionDuration * desktop.totals.sessions + mobile.totals.averageSessionDuration * mobile.totals.sessions) / Math.max(desktop.totals.sessions + mobile.totals.sessions, 1),
    bounceRate: (desktop.totals.bounceRate * desktop.totals.sessions + mobile.totals.bounceRate * mobile.totals.sessions) / Math.max(desktop.totals.sessions + mobile.totals.sessions, 1),
    engagementRate: (desktop.totals.engagementRate * desktop.totals.sessions + mobile.totals.engagementRate * mobile.totals.sessions) / Math.max(desktop.totals.sessions + mobile.totals.sessions, 1),
  };
  const events = {};
  [desktop.events, mobile.events].forEach(evObj => {
    Object.entries(evObj).forEach(([name, v]) => {
      if (!events[name]) events[name] = { count: 0, users: 0 };
      events[name].count += v.count;
      events[name].users += v.users;
    });
  });
  const avgLoadTime = (desktop.avg_load_time_ms > 0 || mobile.avg_load_time_ms > 0)
    ? ((desktop.avg_load_time_ms||0) * (desktop.events.page_load_time?.count||0) + (mobile.avg_load_time_ms||0) * (mobile.events.page_load_time?.count||0))
      / Math.max((desktop.events.page_load_time?.count||0) + (mobile.events.page_load_time?.count||0), 1)
    : 0;
  return {
    totals, events, avg_load_time_ms: avgLoadTime,
    trend: mergeTrend(desktop.trend, mobile.trend),
    channels: mergeBreakdown(desktop.channels, mobile.channels, ["sessions", "totalUsers"]),
    sources: mergeSources(desktop.sources, mobile.sources),
    countries: mergeCountries(desktop.countries, mobile.countries),
    browsers: mergeBreakdown(desktop.browsers, mobile.browsers, ["sessions"]),
    operating_systems: mergeBreakdown(desktop.operating_systems, mobile.operating_systems, ["sessions"]),
    landing_pages: mergeLandingPages(desktop.landing_pages, mobile.landing_pages),
    new_vs_returning: mergeNvr(desktop.new_vs_returning, mobile.new_vs_returning),
    signup_success_by_source: mergeBySource(desktop.signup_success_by_source, mobile.signup_success_by_source),
    event_details: mergeEventDetails(desktop.event_details, mobile.event_details),
    filter_session_rows: [...(desktop.filter_session_rows||[]), ...(mobile.filter_session_rows||[])],
    filter_event_rows: [...(desktop.filter_event_rows||[]), ...(mobile.filter_event_rows||[])],
    filter_source_rows: [...(desktop.filter_source_rows||[]), ...(mobile.filter_source_rows||[])],
    filter_landing_rows: [...(desktop.filter_landing_rows||[]), ...(mobile.filter_landing_rows||[])],
  };
}

// Lightweight desktop+mobile merge for site-switcher domains (basic metrics
// only -- no custom events yet, so no funnel/sources/event-details to merge).
function combineLite(d, m) {
  const dS = d.totals.sessions, mS = m.totals.sessions, sum = Math.max(dS + mS, 1);
  return {
    totals: {
      sessions: dS + mS,
      totalUsers: d.totals.totalUsers + m.totals.totalUsers,
      screenPageViews: d.totals.screenPageViews + m.totals.screenPageViews,
      averageSessionDuration: (d.totals.averageSessionDuration * dS + m.totals.averageSessionDuration * mS) / sum,
      bounceRate: (d.totals.bounceRate * dS + m.totals.bounceRate * mS) / sum,
      engagementRate: (d.totals.engagementRate * dS + m.totals.engagementRate * mS) / sum,
    },
    trend: mergeTrend(d.trend, m.trend),
    channels: mergeBreakdown(d.channels, m.channels, ["sessions", "totalUsers"]),
    countries: mergeBreakdown(d.countries, m.countries, ["sessions", "totalUsers"]),
    browsers: mergeBreakdown(d.browsers, m.browsers, ["sessions"]),
    operating_systems: mergeBreakdown(d.operating_systems, m.operating_systems, ["sessions"]),
    new_vs_returning: mergeNvr(d.new_vs_returning, m.new_vs_returning),
  };
}

// Basic-metrics view for domains that only have GTM/GA4 installed so far,
// without the full custom event tracking plan (see the site switcher).
function renderSiteLite(containerId, s, domain) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  if (s.error) {
    const note = document.createElement("div"); note.className = "note-banner small";
    note.innerHTML = `<b>Не удалось получить данные для ${domain}.</b> ${s.error}`;
    el.appendChild(note);
    return;
  }
  const note = document.createElement("div"); note.className = "site-lite-note";
  note.innerHTML = `<span>ℹ️</span><span>На <b>${domain}</b> счётчик GTM/GA4 уже установлен, но детальная разметка событий (регистрация, клики) сюда ещё не перенесена — показаны только базовые метрики GA4.</span>`;
  el.appendChild(note);

  const kpiGrid = document.createElement("div"); kpiGrid.className = "kpi-grid";
  kpiGrid.appendChild(kpiTile("Сессии", s.totals.sessions, "sessions"));
  kpiGrid.appendChild(kpiTile("Пользователи", s.totals.totalUsers, "totalUsers"));
  kpiGrid.appendChild(kpiTile("Ср. длительность сессии", s.totals.averageSessionDuration, "averageSessionDuration", { format: fmtDur }));
  kpiGrid.appendChild(kpiTile("Показатель отказов", s.totals.bounceRate, "bounceRate", { format: v => v.toFixed(0) + "%" }));
  kpiGrid.appendChild(kpiTile("Engagement rate", s.totals.engagementRate, "engagementRate", { format: v => v.toFixed(0) + "%" }));
  el.appendChild(kpiGrid);

  const trendBody = collapsibleSection(el, "Динамика трафика по дням", "сессии в день");
  const trendCard = document.createElement("div"); trendCard.className = "card";
  trendCard.appendChild(buildTrendChart(s.trend || [], "sessions", "Сессии"));
  trendBody.appendChild(trendCard);

  const chBody = collapsibleSection(el, "Источники трафика", "по каналам");
  const chCard = document.createElement("div"); chCard.className = "card";
  const chBars = (s.channels||[]).slice(0, 10).map(c => ({ label: channelLabel(c.name), value: c.sessions, tip: `${fmtInt(c.sessions)} сессий, ${fmtInt(c.totalUsers)} пользователей` }));
  chCard.appendChild(buildRankedBars(chBars));
  chBody.appendChild(chCard);

  const geoBody = collapsibleSection(el, "География", "топ-10 стран по сессиям");
  const geoCard = document.createElement("div"); geoCard.className = "card";
  const geoBars = (s.countries||[]).slice(0, 10).map(c => ({ label: c.name, value: c.sessions, tip: `${fmtInt(c.sessions)} сессий, ${fmtInt(c.totalUsers)} пользователей` }));
  geoCard.appendChild(buildRankedBars(geoBars));
  geoBody.appendChild(geoCard);

  const techBody = collapsibleSection(el, "Устройства", "браузеры и операционные системы");
  const techCard = document.createElement("div"); techCard.className = "card two-col";
  techCard.appendChild(donutBlock("Браузеры", s.browsers, "sessions"));
  techCard.appendChild(donutBlock("Операционные системы", s.operating_systems, "sessions"));
  techBody.appendChild(techCard);
}

/* ===================== init ===================== */
let DEMO_MODE = false;
let REPORT_INDEX = null;   // {generated_at, domains: [{name, has_events}]}
let CURRENT_SITE = "betwinner.com";
const DOMAIN_CACHE = {};   // name -> fetched per-domain JSON, so switching periods/tabs never re-fetches

// data/<domain>.json is fetched lazily and cached -- only the domain(s)
// actually being viewed cross the network, instead of every domain's data on
// every page load (the old single data.json approach, before it hit GitHub's
// 100MB single-file limit).
async function fetchDomain(name) {
  if (DOMAIN_CACHE[name]) return DOMAIN_CACHE[name];
  const res = await fetch(`data/${encodeURIComponent(name)}.json`, { cache: "no-store" });
  const json = await res.json();
  DOMAIN_CACHE[name] = json;
  return json;
}

function onPeriodChange() { renderAll(CURRENT_SITE); }

async function renderAll(site) {
  CURRENT_SITE = site;
  const isFullGeo = site === "__full_geo__";
  const indexEntry = REPORT_INDEX.domains.find(d => d.name === site);
  const isMain = !isFullGeo && indexEntry && indexEntry.has_events === true;
  document.getElementById("device-tabs").style.display = isMain ? "" : "none";
  document.getElementById("panel-site-lite").style.display = (isMain || isFullGeo) ? "none" : "";
  document.getElementById("period-picker").style.display = isMain ? "" : "none";

  if (isFullGeo) {
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    const fullNames = REPORT_INDEX.domains.filter(d => d.has_events).map(d => d.name);
    const fetched = await Promise.all(fullNames.map(async name => ({ name, ...(await fetchDomain(name)) })));
    const domains = fetched.map(d => ({ name: d.name, desktop: d.desktop, mobile: d.mobile }));
    // combineProps is associative (every field it merges is a sum or a
    // session-weighted average), so the network-wide total is just repeated
    // pairwise combination -- no separate aggregation logic needed.
    const combined = domains.map(d => combineProps(d.desktop, d.mobile)).reduce((acc, cur) => combineProps(acc, cur));
    const panel = document.getElementById("panel-combined");
    renderTab("panel-combined", combined, `Сводно по ${domains.length} рынкам`);
    buildDomainComparisonTable(panel, domains);
    panel.classList.add("active");
    document.getElementById("report-title").textContent = "Full GEO — веб-аналитика по всем рынкам";
    document.getElementById("report-sub").innerHTML = `Обновлено: <b id="generated-at">${new Date(REPORT_INDEX.generated_at).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" })}</b> · Источник: GA4 · ${domains.length} рынков суммарно`;
    setTimeout(() => {
      document.querySelectorAll(".reveal:not(.revealed)").forEach(el => el.classList.add("revealed"));
    }, 20);
    return;
  }

  const siteData = await fetchDomain(site);

  if (isMain) {
    const { desktop, mobile } = siteData;
    buildPeriodPicker((desktop.trend || []).map(t => t.date).sort());
    // renderTab derives every number from filter_session_rows/filter_event_rows
    // via filterSessionRows/filterEventRows, which already bake in the current
    // period selection (see inPeriodRange) -- no need to pre-filter p here.
    const combined = combineProps(desktop, mobile);
    renderTab("panel-combined", combined, "ПК + Моб суммарно.");
    renderTab("panel-desktop", desktop, "версия для настольных компьютеров");
    renderTab("panel-mobile", mobile, "мобильная версия сайта");
    // restore whichever device tab was active -- visibility is driven ENTIRELY
    // by the "active" class (.tab-panel{display:none}/.tab-panel.active{display:block}
    // in CSS); no inline style.display here, or it silently outranks the class
    // by specificity and never gets cleared (this broke the whole report for
    // the ПК/Моб tabs before -- content rendered fine, just stayed invisible).
    const activeBtn = document.querySelector("#device-tabs .tab-btn.active") || document.querySelector("#device-tabs .tab-btn");
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.getElementById("panel-" + activeBtn.dataset.tab).classList.add("active");
    document.getElementById("report-title").textContent = `${site} — веб-аналитика`;
    document.getElementById("report-sub").innerHTML = `Обновлено: <b id="generated-at">${new Date(REPORT_INDEX.generated_at).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" })}</b> · Источник: GA4${site === "betwinner.com" ? " · дефолт-домен, шаблон для остальных · + все зеркала" : ""}`;
  } else {
    // switching to a site-switcher (lite) domain: none of the 3 tab-panels
    // should show through underneath panel-site-lite.
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    const lite = siteData.error ? siteData : combineLite(siteData.desktop, siteData.mobile);
    renderSiteLite("panel-site-lite", siteData.error ? siteData : lite, site);
    document.getElementById("report-title").textContent = `${site} — веб-аналитика`;
    document.getElementById("report-sub").innerHTML = `Обновлено: <b>${new Date(REPORT_INDEX.generated_at).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" })}</b> · Источник: GA4`;
  }
  setTimeout(() => {
    document.querySelectorAll(".reveal:not(.revealed)").forEach(el => el.classList.add("revealed"));
  }, 20);
}

async function initReport() {
  let index;
  try {
    // data/index.json is a tiny manifest (domain list only) -- the actual
    // per-domain data files are fetched lazily by renderAll, only for the
    // domain(s) actually being viewed.
    const res = await fetch("data/index.json", { cache: "no-store" });
    index = await res.json();
  } catch (e) {
    document.getElementById("loading-indicator").innerHTML =
      `<span>Не удалось загрузить данные отчёта. Проверьте соединение и обновите страницу.<br><small>${e.message || e}</small></span>`;
    return;
  }
  REPORT_INDEX = index;
  document.getElementById("generated-at").textContent = new Date(index.generated_at).toLocaleString("ru-RU", { dateStyle: "medium", timeStyle: "short" });
  DEMO_MODE = !!index.demo_mode;

  // site switcher -- "Full GEO" is a synthetic aggregate entry, not a real
  // domain, so it's prepended here rather than coming from the index
  const siteSelect = document.getElementById("site-switcher");
  const siteList = index.domains.map(d => d.name);
  const optionsHtml = [`<option value="__full_geo__">Full GEO (все рынки)</option>`]
    .concat(siteList.map(s => `<option value="${s}">${s}</option>`)).join("");
  siteSelect.innerHTML = optionsHtml;
  // ?site=betwinner.ke in the URL deep-links straight to that GEO's report
  // (used by the report-link column in the status sheet); with no param,
  // Full GEO is now the default landing view instead of betwinner.com.
  const requestedSite = new URLSearchParams(location.search).get("site");
  const initialSite = requestedSite && siteList.includes(requestedSite) ? requestedSite : "__full_geo__";
  siteSelect.value = initialSite;
  siteSelect.addEventListener("change", () => renderAll(siteSelect.value));

  await renderAll(initialSite);

  document.getElementById("loading-indicator").style.display = "none";
  document.getElementById("device-tabs").style.display = "";
}

/* ===================== tabs ===================== */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

if (sessionStorage.getItem("bw_unlocked") === "1") initReport();
</script>
